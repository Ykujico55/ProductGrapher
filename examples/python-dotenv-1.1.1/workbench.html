m():\n        yield runner\n\n\n@pytest.fixture\ndef dotenv_path(tmp_path):\n    path = tmp_path / '.env'\n    path.write_bytes(b'')\n    yield path\n","tests/test_cli.py":"import os\nimport sh\nfrom pathlib import Path\nfrom typing import Optional\n\nimport pytest\n\nimport dotenv\nfrom dotenv.cli import cli as dotenv_cli\nfrom dotenv.version import __version__\n\n\n@pytest.mark.parametrize(\n    \"format,content,expected\",\n    (\n        (None, \"x='a b c'\", '''x=a b c\\n'''),\n        (\"simple\", \"x='a b c'\", '''x=a b c\\n'''),\n        (\"simple\", \"\"\"x='\"a b c\"'\"\"\", '''x=\"a b c\"\\n'''),\n        (\"simple\", '''x=\"'a b c'\"''', '''x='a b c'\\n'''),\n        (\"json\", \"x='a b c'\", '''{\\n  \"x\": \"a b c\"\\n}\\n'''),\n        (\"shell\", \"x='a b c'\", \"x='a b c'\\n\"),\n        (\"shell\", \"\"\"x='\"a b c\"'\"\"\", '''x='\"a b c\"'\\n'''),\n        (\"shell\", '''x=\"'a b c'\"''', '''x=''\"'\"'a b c'\"'\"''\\n'''),\n        (\"shell\", \"x='a\\nb\\nc'\", \"x='a\\nb\\nc'\\n\"),\n        (\"export\", \"x='a b c'\", '''export x='a b c'\\n'''),\n    )\n)\ndef test_list(cli, dotenv_path, format: Optional[str], content: str, expected: str):\n    dotenv_path.write_text(content + '\\n')\n\n    args = ['--file', dotenv_path, 'list']\n    if format is not None:\n        args.extend(['--format', format])\n\n    result = cli.invoke(dotenv_cli, args)\n\n    assert (result.exit_code, result.output) == (0, expected)\n\n\ndef test_list_non_existent_file(cli):\n    result = cli.invoke(dotenv_cli, ['--file', 'nx_file', 'list'])\n\n    assert result.exit_code == 2, result.output\n    assert \"Error opening env file\" in result.output\n\n\ndef test_list_not_a_file(cli):\n    result = cli.invoke(dotenv_cli, ['--file', '.', 'list'])\n\n    assert result.exit_code == 2, result.output\n    assert \"Error opening env file\" in result.output\n\n\ndef test_list_no_file(cli):\n    result = cli.invoke(dotenv.cli.list, [])\n\n    assert (result.exit_code, result.output) == (1, \"\")\n\n\ndef test_get_existing_value(cli, dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = cli.invoke(dotenv_cli, ['--file', dotenv_path, 'get', 'a'])\n\n    assert (result.exit_code, result.output) == (0, \"b\\n\")\n\n\ndef test_get_non_existent_value(cli, dotenv_path):\n    result = cli.invoke(dotenv_cli, ['--file', dotenv_path, 'get', 'a'])\n\n    assert (result.exit_code, result.output) == (1, \"\")\n\n\ndef test_get_non_existent_file(cli):\n    result = cli.invoke(dotenv_cli, ['--file', 'nx_file', 'get', 'a'])\n\n    assert result.exit_code == 2\n    assert \"Error opening env file\" in result.output\n\n\ndef test_get_not_a_file(cli):\n    result = cli.invoke(dotenv_cli, ['--file', '.', 'get', 'a'])\n\n    assert result.exit_code == 2\n    assert \"Error opening env file\" in result.output\n\n\ndef test_unset_existing_value(cli, dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = cli.invoke(dotenv_cli, ['--file', dotenv_path, 'unset', 'a'])\n\n    assert (result.exit_code, result.output) == (0, \"Successfully removed a\\n\")\n    assert dotenv_path.read_text() == \"\"\n\n\ndef test_unset_non_existent_value(cli, dotenv_path):\n    result = cli.invoke(dotenv_cli, ['--file', dotenv_path, 'unset', 'a'])\n\n    assert (result.exit_code, result.output) == (1, \"\")\n    assert dotenv_path.read_text() == \"\"\n\n\n@pytest.mark.parametrize(\n    \"quote_mode,variable,value,expected\",\n    (\n        (\"always\", \"a\", \"x\", \"a='x'\\n\"),\n        (\"never\", \"a\", \"x\", 'a=x\\n'),\n        (\"auto\", \"a\", \"x\", \"a=x\\n\"),\n        (\"auto\", \"a\", \"x y\", \"a='x y'\\n\"),\n        (\"auto\", \"a\", \"$\", \"a='$'\\n\"),\n    )\n)\ndef test_set_quote_options(cli, dotenv_path, quote_mode, variable, value, expected):\n    result = cli.invoke(\n        dotenv_cli,\n        [\"--file\", dotenv_path, \"--export\", \"false\", \"--quote\", quote_mode, \"set\", variable, value]\n    )\n\n    assert (result.exit_code, result.output) == (0, \"{}={}\\n\".format(variable, value))\n    assert dotenv_path.read_text() == expected\n\n\n@pytest.mark.parametrize(\n    \"dotenv_path,export_mode,variable,value,expected\",\n    (\n        (Path(\".nx_file\"), \"true\", \"a\", \"x\", \"export a='x'\\n\"),\n        (Path(\".nx_file\"), \"false\", \"a\", \"x\", \"a='x'\\n\"),\n    )\n)\ndef test_set_export(cli, dotenv_path, export_mode, variable, value, expected):\n    result = cli.invoke(\n        dotenv_cli,\n        [\"--file\", dotenv_path, \"--quote\", \"always\", \"--export\", export_mode, \"set\", variable, value]\n    )\n\n    assert (result.exit_code, result.output) == (0, \"{}={}\\n\".format(variable, value))\n    assert dotenv_path.read_text() == expected\n\n\ndef test_set_non_existent_file(cli):\n    result = cli.invoke(dotenv.cli.set, [\"a\", \"b\"])\n\n    assert (result.exit_code, result.output) == (1, \"\")\n\n\ndef test_set_no_file(cli):\n    result = cli.invoke(dotenv_cli, [\"--file\", \"nx_file\", \"set\"])\n\n    assert result.exit_code == 2\n    assert \"Missing argument\" in result.output\n\n\ndef test_get_default_path(tmp_path):\n    with sh.pushd(tmp_path):\n        (tmp_path / \".env\").write_text(\"a=b\")\n\n        result = sh.dotenv(\"get\", \"a\")\n\n        assert result == \"b\\n\"\n\n\ndef test_run(tmp_path):\n    with sh.pushd(tmp_path):\n        (tmp_path / \".env\").write_text(\"a=b\")\n\n        result = sh.dotenv(\"run\", \"printenv\", \"a\")\n\n        assert result == \"b\\n\"\n\n\ndef test_run_with_existing_variable(tmp_path):\n    with sh.pushd(tmp_path):\n        (tmp_path / \".env\").write_text(\"a=b\")\n        env = dict(os.environ)\n        env.update({\"LANG\": \"en_US.UTF-8\", \"a\": \"c\"})\n\n        result = sh.dotenv(\"run\", \"printenv\", \"a\", _env=env)\n\n        assert result == \"b\\n\"\n\n\ndef test_run_with_existing_variable_not_overridden(tmp_path):\n    with sh.pushd(tmp_path):\n        (tmp_path / \".env\").write_text(\"a=b\")\n        env = dict(os.environ)\n        env.update({\"LANG\": \"en_US.UTF-8\", \"a\": \"c\"})\n\n        result = sh.dotenv(\"run\", \"--no-override\", \"printenv\", \"a\", _env=env)\n\n        assert result == \"c\\n\"\n\n\ndef test_run_with_none_value(tmp_path):\n    with sh.pushd(tmp_path):\n        (tmp_path / \".env\").write_text(\"a=b\\nc\")\n\n        result = sh.dotenv(\"run\", \"printenv\", \"a\")\n\n        assert result == \"b\\n\"\n\n\ndef test_run_with_other_env(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = sh.dotenv(\"--file\", dotenv_path, \"run\", \"printenv\", \"a\")\n\n    assert result == \"b\\n\"\n\n\ndef test_run_without_cmd(cli):\n    result = cli.invoke(dotenv_cli, ['run'])\n\n    assert result.exit_code == 2\n    assert \"Invalid value for '-f'\" in result.output\n\n\ndef test_run_with_invalid_cmd(cli):\n    result = cli.invoke(dotenv_cli, ['run', 'i_do_not_exist'])\n\n    assert result.exit_code == 2\n    assert \"Invalid value for '-f'\" in result.output\n\n\ndef test_run_with_version(cli):\n    result = cli.invoke(dotenv_cli, ['--version'])\n\n    assert result.exit_code == 0\n    assert result.output.strip().endswith(__version__)\n","tests/test_ipython.py":"import os\nfrom unittest import mock\n\nimport pytest\n\n\npytest.importorskip(\"IPython\")\n\n\n@mock.patch.dict(os.environ, {}, clear=True)\ndef test_ipython_existing_variable_no_override(tmp_path):\n    from IPython.terminal.embed import InteractiveShellEmbed\n\n    dotenv_file = tmp_path / \".env\"\n    dotenv_file.write_text(\"a=b\\n\")\n    os.chdir(tmp_path)\n    os.environ[\"a\"] = \"c\"\n\n    ipshell = InteractiveShellEmbed()\n    ipshell.run_line_magic(\"load_ext\", \"dotenv\")\n    ipshell.run_line_magic(\"dotenv\", \"\")\n\n    assert os.environ == {\"a\": \"c\"}\n\n\n@mock.patch.dict(os.environ, {}, clear=True)\ndef test_ipython_existing_variable_override(tmp_path):\n    from IPython.terminal.embed import InteractiveShellEmbed\n\n    dotenv_file = tmp_path / \".env\"\n    dotenv_file.write_text(\"a=b\\n\")\n    os.chdir(tmp_path)\n    os.environ[\"a\"] = \"c\"\n\n    ipshell = InteractiveShellEmbed()\n    ipshell.run_line_magic(\"load_ext\", \"dotenv\")\n    ipshell.run_line_magic(\"dotenv\", \"-o\")\n\n    assert os.environ == {\"a\": \"b\"}\n\n\n@mock.patch.dict(os.environ, {}, clear=True)\ndef test_ipython_new_variable(tmp_path):\n    from IPython.terminal.embed import InteractiveShellEmbed\n\n    dotenv_file = tmp_path / \".env\"\n    dotenv_file.write_text(\"a=b\\n\")\n    os.chdir(tmp_path)\n\n    ipshell = InteractiveShellEmbed()\n    ipshell.run_line_magic(\"load_ext\", \"dotenv\")\n    ipshell.run_line_magic(\"dotenv\", \"\")\n\n    assert os.environ == {\"a\": \"b\"}\n","tests/test_is_interactive.py":"import sys\nimport builtins\nfrom unittest import mock\nfrom dotenv.main import find_dotenv\n\n\nclass TestIsInteractive:\n    \"\"\"Tests for the _is_interactive helper function within find_dotenv.\n\n    The _is_interactive function is used by find_dotenv to determine if the code\n    is running in an interactive environment (like a REPL, IPython notebook, etc.)\n    versus a normal script execution.\n\n    Interactive environments include:\n    - Python REPL (has sys.ps1 or sys.ps2)\n    - IPython notebooks (no __file__ in __main__)\n    - Interactive shells\n\n    Non-interactive environments include:\n    - Normal script execution (has __file__ in __main__)\n    - Module imports\n\n    Examples of the behavior:\n    \u003e\u003e\u003e import sys\n    \u003e\u003e\u003e # In a REPL:\n    \u003e\u003e\u003e hasattr(sys, 'ps1')  # True\n    \u003e\u003e\u003e # In a script:\n    \u003e\u003e\u003e hasattr(sys, 'ps1')  # False\n    \"\"\"\n\n    def _create_dotenv_file(self, tmp_path):\n        \"\"\"Helper to create a test .env file.\"\"\"\n        dotenv_path = tmp_path / \".env\"\n        dotenv_path.write_text(\"TEST=value\")\n        return dotenv_path\n\n    def _setup_subdir_and_chdir(self, tmp_path, monkeypatch):\n        \"\"\"Helper to create subdirectory and change to it.\"\"\"\n        test_dir = tmp_path / \"subdir\"\n        test_dir.mkdir()\n        monkeypatch.chdir(test_dir)\n        return test_dir\n\n    def _remove_ps_attributes(self, monkeypatch):\n        \"\"\"Helper to remove ps1/ps2 attributes if they exist.\"\"\"\n        if hasattr(sys, \"ps1\"):\n            monkeypatch.delattr(sys, \"ps1\")\n        if hasattr(sys, \"ps2\"):\n            monkeypatch.delattr(sys, \"ps2\")\n\n    def _mock_main_import(self, monkeypatch, mock_main_module):\n        \"\"\"Helper to mock __main__ module import.\"\"\"\n        original_import = builtins.__import__\n\n        def mock_import(name, *args, **kwargs):\n            if name == \"__main__\":\n                return mock_main_module\n            return original_import(name, *args, **kwargs)\n\n        monkeypatch.setattr(builtins, \"__import__\", mock_import)\n\n    def _mock_main_import_error(self, monkeypatch):\n        \"\"\"Helper to mock __main__ module import that raises ModuleNotFoundError.\"\"\"\n        original_import = builtins.__import__\n\n        def mock_import(name, *args, **kwargs):\n            if name == \"__main__\":\n                raise ModuleNotFoundError(\"No module named '__main__'\")\n            return original_import(name, *args, **kwargs)\n\n        monkeypatch.setattr(builtins, \"__import__\", mock_import)\n\n    def test_is_interactive_with_ps1(self, tmp_path, monkeypatch):\n        \"\"\"Test that _is_interactive returns True when sys.ps1 exists.\"\"\"\n        dotenv_path = self._create_dotenv_file(tmp_path)\n\n        # Mock sys.ps1 to simulate interactive shell\n        monkeypatch.setattr(sys, \"ps1\", \"\u003e\u003e\u003e \", raising=False)\n\n        self._setup_subdir_and_chdir(tmp_path, monkeypatch)\n\n        # When _is_interactive() returns True, find_dotenv should search from cwd\n        result = find_dotenv()\n        assert result == str(dotenv_path)\n\n    def test_is_interactive_with_ps2(self, tmp_path, monkeypatch):\n        \"\"\"Test that _is_interactive returns True when sys.ps2 exists.\"\"\"\n        dotenv_path = self._create_dotenv_file(tmp_path)\n\n        # Mock sys.ps2 to simulate multi-line interactive input\n        monkeypatch.setattr(sys, \"ps2\", \"... \", raising=False)\n\n        self._setup_subdir_and_chdir(tmp_path, monkeypatch)\n\n        # When _is_interactive() returns True, find_dotenv should search from cwd\n        result = find_dotenv()\n        assert result == str(dotenv_path)\n\n    def test_is_interactive_main_module_not_found(self, tmp_path, monkeypatch):\n        \"\"\"Test that _is_interactive returns False when __main__ module import fails.\"\"\"\n        self._remove_ps_attributes(monkeypatch)\n        self._mock_main_import_error(monkeypatch)\n\n        # Change to directory and test\n        monkeypatch.chdir(tmp_path)\n\n        # Since _is_interactive() returns False, find_dotenv should not find anything\n        # without usecwd=True\n        result = find_dotenv()\n        assert result == \"\"\n\n    def test_is_interactive_main_without_file(self, tmp_path, monkeypatch):\n        \"\"\"Test that _is_interactive returns True when __main__ has no __file__ attribute.\"\"\"\n        self._remove_ps_attributes(monkeypatch)\n        dotenv_path = self._create_dotenv_file(tmp_path)\n\n        # Mock __main__ module without __file__ attribute\n        mock_main = mock.MagicMock()\n        del mock_main.__file__  # Remove __file__ attribute\n\n        self._mock_main_import(monkeypatch, mock_main)\n        self._setup_subdir_and_chdir(tmp_path, monkeypatch)\n\n        # When _is_interactive() returns True, find_dotenv should search from cwd\n        result = find_dotenv()\n        assert result == str(dotenv_path)\n\n    def test_is_interactive_main_with_file(self, tmp_path, monkeypatch):\n        \"\"\"Test that _is_interactive returns False when __main__ has __file__ attribute.\"\"\"\n        self._remove_ps_attributes(monkeypatch)\n\n        # Mock __main__ module with __file__ attribute\n        mock_main = mock.MagicMock()\n        mock_main.__file__ = \"/path/to/script.py\"\n\n        self._mock_main_import(monkeypatch, mock_main)\n\n        # Change to directory and test\n        monkeypatch.chdir(tmp_path)\n\n        # Since _is_interactive() returns False, find_dotenv should not find anything\n        # without usecwd=True\n        result = find_dotenv()\n        assert result == \"\"\n\n    def test_is_interactive_precedence_ps1_over_main(self, tmp_path, monkeypatch):\n        \"\"\"Test that ps1/ps2 attributes take precedence over __main__ module check.\"\"\"\n        dotenv_path = self._create_dotenv_file(tmp_path)\n\n        # Set ps1 attribute\n        monkeypatch.setattr(sys, \"ps1\", \"\u003e\u003e\u003e \", raising=False)\n\n        # Mock __main__ module with __file__ attribute (which would normally return False)\n        mock_main = mock.MagicMock()\n        mock_main.__file__ = \"/path/to/script.py\"\n\n        self._mock_main_import(monkeypatch, mock_main)\n        self._setup_subdir_and_chdir(tmp_path, monkeypatch)\n\n        # ps1 should take precedence, so _is_interactive() returns True\n        result = find_dotenv()\n        assert result == str(dotenv_path)\n\n    def test_is_interactive_ps1_and_ps2_both_exist(self, tmp_path, monkeypatch):\n        \"\"\"Test that _is_interactive returns True when both ps1 and ps2 exist.\"\"\"\n        dotenv_path = self._create_dotenv_file(tmp_path)\n\n        # Set both ps1 and ps2 attributes\n        monkeypatch.setattr(sys, \"ps1\", \"\u003e\u003e\u003e \", raising=False)\n        monkeypatch.setattr(sys, \"ps2\", \"... \", raising=False)\n\n        self._setup_subdir_and_chdir(tmp_path, monkeypatch)\n\n        # Should return True with either attribute present\n        result = find_dotenv()\n        assert result == str(dotenv_path)\n\n    def test_is_interactive_main_module_with_file_attribute_none(self, tmp_path, monkeypatch):\n        \"\"\"Test _is_interactive when __main__ has __file__ attribute set to None.\"\"\"\n        self._remove_ps_attributes(monkeypatch)\n\n        # Mock __main__ module with __file__ = None\n        mock_main = mock.MagicMock()\n        mock_main.__file__ = None\n\n        self._mock_main_import(monkeypatch, mock_main)\n\n        # Mock sys.gettrace to ensure debugger detection returns False\n        monkeypatch.setattr(\"sys.gettrace\", lambda: None)\n\n        monkeypatch.chdir(tmp_path)\n\n        # __file__ = None should still be considered non-interactive\n        # and with no debugger, find_dotenv should not search from cwd\n        result = find_dotenv()\n        assert result == \"\"\n\n    def test_is_interactive_no_ps_attributes_and_normal_execution(self, tmp_path, monkeypatch):\n        \"\"\"Test normal script execution scenario where _is_interactive should return False.\"\"\"\n        self._remove_ps_attributes(monkeypatch)\n\n        # Don't mock anything - let it use the real __main__ module\n        # which should have a __file__ attribute in normal execution\n\n        # Change to directory and test\n        monkeypatch.chdir(tmp_path)\n\n        # In normal execution, _is_interactive() should return False\n        # so find_dotenv should not find anything without usecwd=True\n        result = find_dotenv()\n        assert result == \"\"\n\n    def test_is_interactive_with_usecwd_override(self, tmp_path, monkeypatch):\n        \"\"\"Test that usecwd=True overrides _is_interactive behavior.\"\"\"\n        self._remove_ps_attributes(monkeypatch)\n        dotenv_path = self._create_dotenv_file(tmp_path)\n\n        # Mock __main__ module with __file__ attribute (non-interactive)\n        mock_main = mock.MagicMock()\n        mock_main.__file__ = \"/path/to/script.py\"\n\n        self._mock_main_import(monkeypatch, mock_main)\n        self._setup_subdir_and_chdir(tmp_path, monkeypatch)\n\n        # Even though _is_interactive() returns False, usecwd=True should find the file\n        result = find_dotenv(usecwd=True)\n        assert result == str(dotenv_path)\n","tests/test_main.py":"import io\nimport logging\nimport os\nimport sys\nimport textwrap\nfrom unittest import mock\n\nimport pytest\nimport sh\n\nimport dotenv\n\n\ndef test_set_key_no_file(tmp_path):\n    nx_path = tmp_path / \"nx\"\n    logger = logging.getLogger(\"dotenv.main\")\n\n    with mock.patch.object(logger, \"warning\"):\n        result = dotenv.set_key(nx_path, \"foo\", \"bar\")\n\n    assert result == (True, \"foo\", \"bar\")\n    assert nx_path.exists()\n\n\n@pytest.mark.parametrize(\n    \"before,key,value,expected,after\",\n    [\n        (\"\", \"a\", \"\", (True, \"a\", \"\"), \"a=''\\n\"),\n        (\"\", \"a\", \"b\", (True, \"a\", \"b\"), \"a='b'\\n\"),\n        (\"\", \"a\", \"'b'\", (True, \"a\", \"'b'\"), \"a='\\\\'b\\\\''\\n\"),\n        (\"\", \"a\", '\"b\"', (True, \"a\", '\"b\"'), \"a='\\\"b\\\"'\\n\"),\n        (\"\", \"a\", \"b'c\", (True, \"a\", \"b'c\"), \"a='b\\\\'c'\\n\"),\n        (\"\", \"a\", 'b\"c', (True, \"a\", 'b\"c'), \"a='b\\\"c'\\n\"),\n        (\"a=b\", \"a\", \"c\", (True, \"a\", \"c\"), \"a='c'\\n\"),\n        (\"a=b\\n\", \"a\", \"c\", (True, \"a\", \"c\"), \"a='c'\\n\"),\n        (\"a=b\\n\\n\", \"a\", \"c\", (True, \"a\", \"c\"), \"a='c'\\n\\n\"),\n        (\"a=b\\nc=d\", \"a\", \"e\", (True, \"a\", \"e\"), \"a='e'\\nc=d\"),\n        (\"a=b\\nc=d\\ne=f\", \"c\", \"g\", (True, \"c\", \"g\"), \"a=b\\nc='g'\\ne=f\"),\n        (\"a=b\\n\", \"c\", \"d\", (True, \"c\", \"d\"), \"a=b\\nc='d'\\n\"),\n        (\"a=b\", \"c\", \"d\", (True, \"c\", \"d\"), \"a=b\\nc='d'\\n\"),\n    ],\n)\ndef test_set_key(dotenv_path, before, key, value, expected, after):\n    logger = logging.getLogger(\"dotenv.main\")\n    dotenv_path.write_text(before)\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.set_key(dotenv_path, key, value)\n\n    assert result == expected\n    assert dotenv_path.read_text() == after\n    mock_warning.assert_not_called()\n\n\ndef test_set_key_encoding(dotenv_path):\n    encoding = \"latin-1\"\n\n    result = dotenv.set_key(dotenv_path, \"a\", \"é\", encoding=encoding)\n\n    assert result == (True, \"a\", \"é\")\n    assert dotenv_path.read_text(encoding=encoding) == \"a='é'\\n\"\n\n\ndef test_set_key_permission_error(dotenv_path):\n    dotenv_path.chmod(0o000)\n\n    with pytest.raises(Exception):\n        dotenv.set_key(dotenv_path, \"a\", \"b\")\n\n    dotenv_path.chmod(0o600)\n    assert dotenv_path.read_text() == \"\"\n\n\ndef test_get_key_no_file(tmp_path):\n    nx_path = tmp_path / \"nx\"\n    logger = logging.getLogger(\"dotenv.main\")\n\n    with (\n        mock.patch.object(logger, \"info\") as mock_info,\n        mock.patch.object(logger, \"warning\") as mock_warning,\n    ):\n        result = dotenv.get_key(nx_path, \"foo\")\n\n    assert result is None\n    mock_info.assert_has_calls(\n        calls=[\n            mock.call(\"python-dotenv could not find configuration file %s.\", nx_path)\n        ],\n    )\n    mock_warning.assert_has_calls(\n        calls=[mock.call(\"Key %s not found in %s.\", \"foo\", nx_path)],\n    )\n\n\ndef test_get_key_not_found(dotenv_path):\n    logger = logging.getLogger(\"dotenv.main\")\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.get_key(dotenv_path, \"foo\")\n\n    assert result is None\n    mock_warning.assert_called_once_with(\"Key %s not found in %s.\", \"foo\", dotenv_path)\n\n\ndef test_get_key_ok(dotenv_path):\n    logger = logging.getLogger(\"dotenv.main\")\n    dotenv_path.write_text(\"foo=bar\")\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.get_key(dotenv_path, \"foo\")\n\n    assert result == \"bar\"\n    mock_warning.assert_not_called()\n\n\ndef test_get_key_encoding(dotenv_path):\n    encoding = \"latin-1\"\n    dotenv_path.write_text(\"é=è\", encoding=encoding)\n\n    result = dotenv.get_key(dotenv_path, \"é\", encoding=encoding)\n\n    assert result == \"è\"\n\n\ndef test_get_key_none(dotenv_path):\n    logger = logging.getLogger(\"dotenv.main\")\n    dotenv_path.write_text(\"foo\")\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.get_key(dotenv_path, \"foo\")\n\n    assert result is None\n    mock_warning.assert_not_called()\n\n\ndef test_unset_with_value(dotenv_path):\n    logger = logging.getLogger(\"dotenv.main\")\n    dotenv_path.write_text(\"a=b\\nc=d\")\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.unset_key(dotenv_path, \"a\")\n\n    assert result == (True, \"a\")\n    assert dotenv_path.read_text() == \"c=d\"\n    mock_warning.assert_not_called()\n\n\ndef test_unset_no_value(dotenv_path):\n    logger = logging.getLogger(\"dotenv.main\")\n    dotenv_path.write_text(\"foo\")\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.unset_key(dotenv_path, \"foo\")\n\n    assert result == (True, \"foo\")\n    assert dotenv_path.read_text() == \"\"\n    mock_warning.assert_not_called()\n\n\ndef test_unset_encoding(dotenv_path):\n    encoding = \"latin-1\"\n    dotenv_path.write_text(\"é=x\", encoding=encoding)\n\n    result = dotenv.unset_key(dotenv_path, \"é\", encoding=encoding)\n\n    assert result == (True, \"é\")\n    assert dotenv_path.read_text(encoding=encoding) == \"\"\n\n\ndef test_set_key_unauthorized_file(dotenv_path):\n    dotenv_path.chmod(0o000)\n\n    with pytest.raises(PermissionError):\n        dotenv.set_key(dotenv_path, \"a\", \"x\")\n\n\ndef test_unset_non_existent_file(tmp_path):\n    nx_path = tmp_path / \"nx\"\n    logger = logging.getLogger(\"dotenv.main\")\n\n    with mock.patch.object(logger, \"warning\") as mock_warning:\n        result = dotenv.unset_key(nx_path, \"foo\")\n\n    assert result == (None, \"foo\")\n    mock_warning.assert_called_once_with(\n        \"Can't delete from %s - it doesn't exist.\",\n        nx_path,\n    )\n\n\ndef prepare_file_hierarchy(path):\n    \"\"\"\n    Create a temporary folder structure like the following:\n\n        test_find_dotenv0/\n        └── child1\n            ├── child2\n            │   └── child3\n            │       └── child4\n            └── .env\n\n    Then try to automatically `find_dotenv` starting in `child4`\n    \"\"\"\n\n    leaf = path / \"child1\" / \"child2\" / \"child3\" / \"child4\"\n    leaf.mkdir(parents=True, exist_ok=True)\n    return leaf\n\n\ndef test_find_dotenv_no_file_raise(tmp_path):\n    leaf = prepare_file_hierarchy(tmp_path)\n    os.chdir(leaf)\n\n    with pytest.raises(IOError):\n        dotenv.find_dotenv(raise_error_if_not_found=True, usecwd=True)\n\n\ndef test_find_dotenv_no_file_no_raise(tmp_path):\n    leaf = prepare_file_hierarchy(tmp_path)\n    os.chdir(leaf)\n\n    result = dotenv.find_dotenv(usecwd=True)\n\n    assert result == \"\"\n\n\ndef test_find_dotenv_found(tmp_path):\n    leaf = prepare_file_hierarchy(tmp_path)\n    os.chdir(leaf)\n    dotenv_path = tmp_path / \".env\"\n    dotenv_path.write_bytes(b\"TEST=test\\n\")\n\n    result = dotenv.find_dotenv(usecwd=True)\n\n    assert result == str(dotenv_path)\n\n\n@mock.patch.dict(os.environ, {}, clear=True)\ndef test_load_dotenv_existing_file(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = dotenv.load_dotenv(dotenv_path)\n\n    assert result is True\n    assert os.environ == {\"a\": \"b\"}\n\n\ndef test_load_dotenv_no_file_verbose():\n    logger = logging.getLogger(\"dotenv.main\")\n\n    with mock.patch.object(logger, \"info\") as mock_info:\n        result = dotenv.load_dotenv(\".does_not_exist\", verbose=True)\n\n    assert result is False\n    mock_info.assert_called_once_with(\n        \"python-dotenv could not find configuration file %s.\", \".does_not_exist\"\n    )\n\n\n@mock.patch.dict(os.environ, {\"a\": \"c\"}, clear=True)\ndef test_load_dotenv_existing_variable_no_override(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = dotenv.load_dotenv(dotenv_path, override=False)\n\n    assert result is True\n    assert os.environ == {\"a\": \"c\"}\n\n\n@mock.patch.dict(os.environ, {\"a\": \"c\"}, clear=True)\ndef test_load_dotenv_existing_variable_override(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = dotenv.load_dotenv(dotenv_path, override=True)\n\n    assert result is True\n    assert os.environ == {\"a\": \"b\"}\n\n\n@mock.patch.dict(os.environ, {\"a\": \"c\"}, clear=True)\ndef test_load_dotenv_redefine_var_used_in_file_no_override(dotenv_path):\n    dotenv_path.write_text('a=b\\nd=\"${a}\"')\n\n    result = dotenv.load_dotenv(dotenv_path)\n\n    assert result is True\n    assert os.environ == {\"a\": \"c\", \"d\": \"c\"}\n\n\n@mock.patch.dict(os.environ, {\"a\": \"c\"}, clear=True)\ndef test_load_dotenv_redefine_var_used_in_file_with_override(dotenv_path):\n    dotenv_path.write_text('a=b\\nd=\"${a}\"')\n\n    result = dotenv.load_dotenv(dotenv_path, override=True)\n\n    assert result is True\n    assert os.environ == {\"a\": \"b\", \"d\": \"b\"}\n\n\n@mock.patch.dict(os.environ, {}, clear=True)\ndef test_load_dotenv_string_io_utf_8():\n    stream = io.StringIO(\"a=à\")\n\n    result = dotenv.load_dotenv(stream=stream)\n\n    assert result is True\n    assert os.environ == {\"a\": \"à\"}\n\n\n@mock.patch.dict(os.environ, {}, clear=True)\ndef test_load_dotenv_file_stream(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    with dotenv_path.open() as f:\n        result = dotenv.load_dotenv(stream=f)\n\n    assert result is True\n    assert os.environ == {\"a\": \"b\"}\n\n\ndef test_load_dotenv_in_current_dir(tmp_path):\n    dotenv_path = tmp_path / \".env\"\n    dotenv_path.write_bytes(b\"a=b\")\n    code_path = tmp_path / \"code.py\"\n    code_path.write_text(\n        textwrap.dedent(\"\"\"\n        import dotenv\n        import os\n\n        dotenv.load_dotenv(verbose=True)\n        print(os.environ['a'])\n    \"\"\")\n    )\n    os.chdir(tmp_path)\n\n    result = sh.Command(sys.executable)(code_path)\n\n    assert result == \"b\\n\"\n\n\ndef test_dotenv_values_file(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    result = dotenv.dotenv_values(dotenv_path)\n\n    assert result == {\"a\": \"b\"}\n\n\n@pytest.mark.parametrize(\n    \"env,string,interpolate,expected\",\n    [\n        # Defined in environment, with and without interpolation\n        ({\"b\": \"c\"}, \"a=$b\", False, {\"a\": \"$b\"}),\n        ({\"b\": \"c\"}, \"a=$b\", True, {\"a\": \"$b\"}),\n        ({\"b\": \"c\"}, \"a=${b}\", False, {\"a\": \"${b}\"}),\n        ({\"b\": \"c\"}, \"a=${b}\", True, {\"a\": \"c\"}),\n        ({\"b\": \"c\"}, \"a=${b:-d}\", False, {\"a\": \"${b:-d}\"}),\n        ({\"b\": \"c\"}, \"a=${b:-d}\", True, {\"a\": \"c\"}),\n        # Defined in file\n        ({}, \"b=c\\na=${b}\", True, {\"a\": \"c\", \"b\": \"c\"}),\n        # Undefined\n        ({}, \"a=${b}\", True, {\"a\": \"\"}),\n        ({}, \"a=${b:-d}\", True, {\"a\": \"d\"}),\n        # With quotes\n        ({\"b\": \"c\"}, 'a=\"${b}\"', True, {\"a\": \"c\"}),\n        ({\"b\": \"c\"}, \"a='${b}'\", True, {\"a\": \"c\"}),\n        # With surrounding text\n        ({\"b\": \"c\"}, \"a=x${b}y\", True, {\"a\": \"xcy\"}),\n        # Self-referential\n        ({\"a\": \"b\"}, \"a=${a}\", True, {\"a\": \"b\"}),\n        ({}, \"a=${a}\", True, {\"a\": \"\"}),\n        ({\"a\": \"b\"}, \"a=${a:-c}\", True, {\"a\": \"b\"}),\n        ({}, \"a=${a:-c}\", True, {\"a\": \"c\"}),\n        # Reused\n        ({\"b\": \"c\"}, \"a=${b}${b}\", True, {\"a\": \"cc\"}),\n        # Re-defined and used in file\n        ({\"b\": \"c\"}, \"b=d\\na=${b}\", True, {\"a\": \"d\", \"b\": \"d\"}),\n        ({}, \"a=b\\na=c\\nd=${a}\", True, {\"a\": \"c\", \"d\": \"c\"}),\n        ({}, \"a=b\\nc=${a}\\nd=e\\nc=${d}\", True, {\"a\": \"b\", \"c\": \"e\", \"d\": \"e\"}),\n    ],\n)\ndef test_dotenv_values_string_io(env, string, interpolate, expected):\n    with mock.patch.dict(os.environ, env, clear=True):\n        stream = io.StringIO(string)\n        stream.seek(0)\n\n        result = dotenv.dotenv_values(stream=stream, interpolate=interpolate)\n\n        assert result == expected\n\n\ndef test_dotenv_values_file_stream(dotenv_path):\n    dotenv_path.write_text(\"a=b\")\n\n    with dotenv_path.open() as f:\n        result = dotenv.dotenv_values(stream=f)\n\n    assert result == {\"a\": \"b\"}\n","tests/test_parser.py":"import io\n\nimport pytest\n\nfrom dotenv.parser import Binding, Original, parse_stream\n\n\n@pytest.mark.parametrize(\"test_input,expected\", [\n    (u\"\", []),\n    (u\"a=b\", [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\"a=b\", line=1), error=False)]),\n    (u\"'a'=b\", [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\"'a'=b\", line=1), error=False)]),\n    (u\"[=b\", [Binding(key=u\"[\", value=u\"b\", original=Original(string=u\"[=b\", line=1), error=False)]),\n    (u\" a = b \", [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\" a = b \", line=1), error=False)]),\n    (u\"export a=b\", [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\"export a=b\", line=1), error=False)]),\n    (\n        u\" export 'a'=b\",\n        [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\" export 'a'=b\", line=1), error=False)],\n    ),\n    (u\"# a=b\", [Binding(key=None, value=None, original=Original(string=u\"# a=b\", line=1), error=False)]),\n    (u\"a=b#c\", [Binding(key=u\"a\", value=u\"b#c\", original=Original(string=u\"a=b#c\", line=1), error=False)]),\n    (\n        u'a=b #c',\n        [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\"a=b #c\", line=1), error=False)],\n    ),\n    (\n        u'a=b\\t#c',\n        [Binding(key=u\"a\", value=u\"b\", original=Original(string=u\"a=b\\t#c\", line=1), error=False)],\n    ),\n    (\n        u\"a=b c\",\n ndef test_parse_variables(value, expected):\n    result = parse_variables(value)\n\n    assert list(result) == expected\n","tests/test_zip_imports.py":"import os\nimport sys\nimport sh\nimport textwrap\nfrom typing import List\nfrom unittest import mock\nfrom zipfile import ZipFile\n\n\ndef walk_to_root(path: str):\n    last_dir = None\n    current_dir = path\n    while last_dir != current_dir:\n        yield current_dir\n        (parent_dir, _) = os.path.split(current_dir)\n        last_dir, current_dir = current_dir, parent_dir\n\n\nclass FileToAdd:\n    def __init__(self, content: str, path: str):\n        self.content = content\n        self.path = path\n\n\ndef setup_zipfile(path, files: List[FileToAdd]):\n    zip_file_path = path / \"test.zip\"\n    dirs_init_py_added_to = set()\n    with ZipFile(zip_file_path, \"w\") as zip:\n        for f in files:\n            zip.writestr(data=f.content, zinfo_or_arcname=f.path)\n            for dir in walk_to_root(os.path.dirname(f.path)):\n                if dir not in dirs_init_py_added_to:\n                    print(os.path.join(dir, \"__init__.py\"))\n                    zip.writestr(\n                        data=\"\", zinfo_or_arcname=os.path.join(dir, \"__init__.py\")\n                    )\n                    dirs_init_py_added_to.add(dir)\n    return zip_file_path\n\n\n@mock.patch.object(sys, \"path\", list(sys.path))\ndef test_load_dotenv_gracefully_handles_zip_imports_when_no_env_file(tmp_path):\n    zip_file_path = setup_zipfile(\n        tmp_path,\n        [\n            FileToAdd(\n                content=textwrap.dedent(\n                    \"\"\"\n            from dotenv import load_dotenv\n\n            load_dotenv()\n        \"\"\"\n                ),\n                path=\"child1/child2/test.py\",\n            ),\n        ],\n    )\n\n    # Should run without an error\n    sys.path.append(str(zip_file_path))\n    import child1.child2.test  # noqa\n\n\ndef test_load_dotenv_outside_zip_file_when_called_in_zipfile(tmp_path):\n    zip_file_path = setup_zipfile(\n        tmp_path,\n        [\n            FileToAdd(\n                content=textwrap.dedent(\n                    \"\"\"\n            from dotenv import load_dotenv\n\n            load_dotenv()\n        \"\"\"\n                ),\n                path=\"child1/child2/test.py\",\n            ),\n        ],\n    )\n    dotenv_path = tmp_path / \".env\"\n    dotenv_path.write_bytes(b\"a=b\")\n    code_path = tmp_path / \"code.py\"\n    code_path.write_text(\n        textwrap.dedent(\n            f\"\"\"\n        import os\n        import sys\n\n        sys.path.append(\"{zip_file_path}\")\n\n        import child1.child2.test\n\n        print(os.environ['a'])\n    \"\"\"\n        )\n    )\n    os.chdir(str(tmp_path))\n\n    result = sh.Command(sys.executable)(code_path)\n\n    assert result == \"b\\n\"\n","tox.ini":"[tox]\nenvlist = lint,py{39,310,311,312,313},pypy3,manifest,coverage-report\n\n[gh-actions]\npython =\n    3.9: py39\n    3.10: py310\n    3.11: py311\n    3.12: py312\n    3.13: py313, lint, manifest\n    pypy-3.9: pypy3\n\n[testenv]\ndeps =\n    pytest\n    pytest-cov\n    sh \u003e= 2.0.2, \u003c3\n    click\n    py{39,310,311,312,313,pypy3}: ipython\ncommands = pytest --cov --cov-report=term-missing --cov-config setup.cfg {posargs}\ndepends =\n    py{39,310,311,312,313},pypy3: coverage-clean\n    coverage-report: py{39,310,311,312,313},pypy3\n\n[testenv:lint]\nskip_install = true\ndeps =\n    flake8\n    mypy\ncommands =\n    flake8 src tests\n    mypy --python-version=3.13 src tests\n    mypy --python-version=3.12 src tests\n    mypy --python-version=3.11 src tests\n    mypy --python-version=3.10 src tests\n    mypy --python-version=3.9 src tests\n\n[testenv:manifest]\ndeps = check-manifest\nskip_install = true\ncommands = check-manifest\n\n[testenv:coverage-clean]\ndeps = coverage\nskip_install = true\ncommands = coverage erase\n\n[testenv:coverage-report]\ndeps = coverage\nskip_install = true\ncommands =\n    coverage report\n"},"name":"Python 项目","nodes":[{"end":34,"file":"src/dotenv/ipython.py","id":"class:src/dotenv/ipython.py:IPythonDotEnv","kind":"class","label":"IPythonDotEnv","line":9,"qualname":"IPythonDotEnv"},{"end":114,"file":"src/dotenv/main.py","id":"class:src/dotenv/main.py:DotEnv","kind":"class","label":"DotEnv","line":34,"qualname":"DotEnv"},{"end":37,"file":"src/dotenv/parser.py","id":"class:src/dotenv/parser.py:Binding","kind":"class","label":"Binding","line":33,"qualname":"Binding"},{"end":59,"file":"src/dotenv/parser.py","id":"class:src/dotenv/parser.py:Error","kind":"class","label":"Error","line":58,"qualname":"Error"},{"end":30,"file":"src/dotenv/parser.py","id":"class:src/dotenv/parser.py:Original","kind":"class","label":"Original","line":28,"qualname":"Original"},{"end":55,"file":"src/dotenv/parser.py","id":"class:src/dotenv/parser.py:Position","kind":"class","label":"Position","line":40,"qualname":"Position"},{"end":95,"file":"src/dotenv/parser.py","id":"class:src/dotenv/parser.py:Reader","kind":"class","label":"Reader","line":62,"qualname":"Reader"},{"end":26,"file":"src/dotenv/variables.py","id":"class:src/dotenv/variables.py:Atom","kind":"class","label":"Atom","line":18,"qualname":"Atom"},{"end":45,"file":"src/dotenv/variables.py","id":"class:src/dotenv/variables.py:Literal","kind":"class","label":"Literal","line":29,"qualname":"Literal"},{"end":67,"file":"src/dotenv/variables.py","id":"class:src/dotenv/variables.py:Variable","kind":"class","label":"Variable","line":48,"qualname":"Variable"},{"end":227,"file":"tests/test_is_interactive.py","id":"class:tests/test_is_interactive.py:TestIsInteractive","kind":"class","label":"TestIsInteractive","line":7,"qualname":"TestIsInteractive"},{"end":22,"file":"tests/test_zip_imports.py","id":"class:tests/test_zip_imports.py:FileToAdd","kind":"class","label":"FileToAdd","line":19,"qualname":"FileToAdd"},{"basis":"setuptools 控制台脚本注册","end":49,"file":"setup.py","id":"entry:setup.py:functi {"end":107,"file":"src/dotenv/cli.py","line":98},{"end":149,"file":"src/dotenv/main.py","line":130},{"end":197,"file":"src/dotenv/main.py","line":166}],"text":"读取全局 FILE、QUOTE、EXPORT 后调用 set_key：set_key 先校验 quote_mode 为 always/auto/never，再按 always 或 auto 且值不是纯字母数字决定加单引号（内部单引号转义），export 决定是否写 export 前缀；rewrite 会先 touch 目标文件，因此文件不存在也会创建空文件后进入逐行重写。逐行重写时每个同名键行都写入同一新行（重复键会产生多条相同新行），没有匹配时在末尾追加；成功后 CLI 打印 key=value，若 set_key 返回假值则退出 1。例：文件同时含 A 与 B 时设置 B 只改 B 行，A 行原样写回。","title":"设置或更新单个键值"},{"aliases":["dotenv unset","unset","删除配置","移除键"],"capability":"命令行配置修改","nodeId":"entry:src/dotenv/cli.py:function:src/dotenv/cli.py:unset:127:Click · unset","refs":[{"end":138,"file":"src/dotenv/cli.py","line":130},{"end":149,"file":"src/dotenv/main.py","line":130},{"end":230,"file":"src/dotenv/main.py","line":200}],"text":"读取 FILE 与 QUOTE 后调用 unset_key；unset_key 在文件不存在时记录警告并返回 (None, key)，键不存在时在重写后记录警告并返回 (None, key)，CLI 对 success 为假值的这两种情况都退出 1。存在时逐行写回所有非匹配行并移除所有同名键行；例如文件含 A、B 时删除 B 后文件仍保留 A。传入的 quote_mode 在可见的 unset_key 实现中没有被使用。","title":"删除单个键"},{"aliases":["dotenv run","run","执行命令","加载环境运行"],"capability":"带环境运行命令","nodeId":"entry:src/dotenv/cli.py:function:src/dotenv/cli.py:run:141:Click · run","refs":[{"end":166,"file":"src/dotenv/cli.py","line":141}],"text":"运行前先要求 -f 指定的文件存在，否则抛 BadParameter；随后从该文件读取非 None 的值，默认 override=True 让 .env 值覆盖同名进程变量，--no-override 时只保留当前环境没有的键；没有命令参数时先打印 No command given 并退出 1，否则调用 run_command。","title":"带 .env 环境运行命令"},{"aliases":["os.execvpe","Popen","子进程环境"],"capability":"带环境运行命令","nodeId":"function:src/dotenv/cli.py:run_command","refs":[{"end":205,"file":"src/dotenv/cli.py","line":169}],"text":"复制当前 os.environ 并用传入的环境字典更新；Windows 使用 Popen 等待命令结束后以子进程返回码退出，其他平台调用 os.execvpe 用新环境替换当前进程。","title":"构造子进程环境并执行命令"},{"aliases":["dotenv_values","load_dotenv","find_dotenv","set_key","unset_key"],"capability":"核心配置读写","nodeId":"module:src/dotenv/main.py","refs":[{"end":324,"file":"src/dotenv/main.py","line":276},{"end":364,"file":"src/dotenv/main.py","line ":89}],"text":"load_dotenv 默认 override=False：路径和流都未提供时先查找 .env；已有同名环境变量时跳过，值为 None 的项从不写入。只要解析出的字典非空就返回 True，即使没有任何实际写入；空字典才返回 False。"},{"refs":[{"end":400,"file":"src/dotenv/main.py","line":367},{"end":81,"file":"src/dotenv/main.py","line":67},{"end":250,"file":"src/dotenv/main.py","line":245}],"text":"dotenv_values 在路径和流都未提供时先查找 .env；它返回解析字典而不修改 os.environ，无值键为 None，是否插值由 interpolate 决定。启用插值时内部按 override=True 让此前已解析的 .env 值优先于同名环境变量；结果为空字典时不会命中缓存，会再次解析。"},{"refs":[{"end":255,"file":"src/dotenv/main.py","line":233},{"end":67,"file":"src/dotenv/variables.py","line":64}],"text":"变量插值时顺序处理条目：override=True 先放入 os.environ，再用此前已解析的 .env 值覆盖，故 .env 同名值优先；override=False 则环境变量优先。value 为 None 的条目结果保持 None；引用取到 None（包括被前序 .env 的 None 覆盖）时按空串处理，变量缺失则用默认值，无默认也是空串。"}],"refs":[{"end":20,"file":"setup.py","line":20},{"end":64,"file":"setup.py","line":63},{"end":4,"file":"src/dotenv/__init__.py","line":3},{"end":9,"file":"src/dotenv/__init__.py","line":7},{"end":49,"file":"src/dotenv/__init__.py","line":42},{"end":50,"file":"setup.py","line":47},{"end":6,"file":"src/dotenv/__main__.py","line":3},{"end":16,"file":"src/dotenv/cli.py","line":11},{"end":50,"file":"src/dotenv/cli.py","line":36},{"end":33,"file":"src/dotenv/cli.py","line":22},{"end":66,"file":"src/dotenv/cli.py","line":53},{"end":91,"file":"src/dotenv/cli.py","line":69},{"end":124,"file":"src/dotenv/cli.py","line":110},{"end":149,"file":"src/dotenv/main.py","line":130},{"end":197,"file":"src/dotenv/main.py","line":152},{"end":230,"file":"src/dotenv/main.py","line":200},{"end":107,"file":"src/dotenv/cli.py","line":103},{"end":138,"file":"src/dotenv/cli.py","line":134},{"end":166,"file":"src/dotenv/cli.py","line":141},{"end":9,"file":"src/dotenv/ipython.py","line":8},{"end":34,"file":"src/dotenv/ipython.py","line":11},{"end":39,"file":"src/dotenv/ipython.py","line":37},{"end":324,"file":"src/dotenv/main.py","line":300},{"end":364,"file":"src/dotenv/main.py","line":327},{"end":102,"file":"src/dotenv/main.py","line":89},{"en         wholeCallGraph = false;
        if (["structure", "product", "collaboration"].includes(next)) setScope(productRoot.id);
        if (next === "collaboration") {
          const focus = $("module-focus").value;
          chosen = new Set(focus ? [focus] : []);
          inspector = "evidence";
        } else selectScopeInView();
        currentThread = "";
        render();
    }
    for (const b of document.querySelectorAll("[data-view]"))
      b.onclick = () => selectView(b.dataset.view);
    for (const id of ["module-focus", "module-direction"])
      $(id).onchange = () => { modulePage = 0; selectView("collaboration"); };
    $("module-prev").onclick = () => { modulePage--; selectView("collaboration"); };
    $("module-next").onclick = () => { modulePage++; selectView("collaboration"); };
    for (const b of document.querySelectorAll("[data-inspect]"))
      b.onclick = () => selectInspector(b.dataset.inspect);
    for (const mode of ["pan", "select"])
      $(mode).onclick = () => {
        tool = mode;
        syncTool();
      };
    $("plus").onclick = () => zoom(1.2);
    $("minus").onclick = () => zoom(1 / 1.2);
    $("fit").onclick = () => fitCanvas();
    $("call-range").onclick = () => {
      wholeCallGraph = !wholeCallGraph;
      if (!wholeCallGraph) {
        const selected = graphKeys()[0];
        if (chosen.size === 1 && scopedCode.items.some(n => n.id === selected))
          callFocus = selected;
        pick([callFocus]);
      }
      render();
    };
    bindCanvas();
    bindFullscreen();
    render();
    function openLinkedSource() {
      const location = new URLSearchParams(window.location.hash.slice(1));
      if (location.get("settings") === "models") {
        if (!modelDialog().open) openModelSettings();
        return;
      }
      if (!location.has("file")) {
        const views = new Map([["structure", "structure"], ["business", "product"], ["collaboration", "collaboration"]]);
        if (views.has(location.get("view"))) selectView(views.get(location.get("view")));
        return;
      }
      const file = location.get("file");
      const line = Number(location.get("line"));
      const text = graph.files[file];
      if (typeof text !== "string") return;
      const leaf = moduleLeaves.get(file);
      if (!Number.isInteger(line) || line < 1 || line > text.split(/\r?\n/).length) {
        if (leaf) navigate(leaf.id);
        return;
      }
      const node = sourceNode(file, line);
      const ref = {file, line, end: line};
      if (node) locateSymbol(node, ref);
      else {
        requestedSource = ref;
        selectInspector("evidence");
      }
    }
    window.addEventListener("hashchange", openLinkedSource);
    openLinkedSource();
    if (generation) {
      showGeneration(generation);
      if (generation.status === "running") monitorGeneration(false);
    }
  }
  init().catch((err) => {
    $("connection").textContent = "加载失败";
    $("scope-name").textContent = "无法打开仓库图";
    $("metrics").textContent = err.message;
  });
})();
</script>
</body>
</html>
