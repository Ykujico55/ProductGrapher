<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>How2Trust · 仓库架构工作台</title>
  <style>:root {
  font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #233637;
  background: #f8faf8;
  font-synthesis: none;
  --ink: #203333;
  --muted: #617572;
  --line: #dce4df;
  --green: #166c59;
  --mint: #e1f1e9;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  border: 0;
  background: none;
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.46;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
svg g:focus-visible {
  outline: 2px solid #318571;
  outline-offset: 2px;
}
i[data-icon] {
  display: inline-flex;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  flex: none;
}
i svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h2 {
  font-size: 15px;
  font-weight: 650;
}
.topbar {
  height: 64px;
  background: #142d2b;
  color: #f6fbf8;
  display: flex;
  gap: 17px;
  align-items: center;
  padding: 0 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -1.3px;
}
.brandmark[data-icon] {
  background: #bce8b4;
  border-radius: 8px;
  width: 33px;
  height: 33px;
  color: #173d32;
  padding: 5px;
}
.head-divider {
  width: 1px;
  height: 20px;
  background: #43615b;
}
.app-label {
  font-size: 14px;
  color: #c5d6cd;
}
.top-spacer {
  flex: 1;
}
.connection {
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.connection:before,
.live-dot {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ade0a7;
}
.snapshot {
  font: 12px var(--mono);
  color: #b1c7be;
}
.workspace {
  --nav-width: 230px;
  --graph-min-width: 330px;
  --inspector-default: 310px;
  --inspector-min: 240px;
  --inspector-track: clamp(var(--inspector-min), var(--inspector-width, var(--inspector-default)),
    calc(100% - var(--nav-width) - var(--graph-min-width)));
  display: grid;
  grid-template-columns: var(--nav-width) minmax(var(--graph-min-width), 1fr) var(--inspector-track);
  height: calc(100dvh - 64px);
  min-height: 560px;
}
.navpanel,
.mainpanel,
.inspector {
  min-width: 0;
  min-height: 0;
}
.navpanel {
  background: #f1f5f1;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 22px 12px 12px;
}
.project-summary {
  display: flex;
  align-items: center;
  padding: 2px 8px 22px;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.project-summary > i {
  background: white;
  border: 1px solid var(--line);
  width: 37px;
  height: 37px;
  border-radius: 9px;
  padding: 8px;
  color: #34674e;
}
.project-summary div {
  min-width: 0;
}
.project-summary small {
  font-size: 12px;
  color: var(--muted);
  display: block;
  margin-bottom: 4px;
}
.project-summary strong {
  font-size: 15px;
  display: block;
  overflow-wrap: anywhere;
}
.nav-head,
.inspector-header,
.dialog-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-head {
  padding: 16px 5px 8px;
}
.icon-btn {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  color: var(--muted);
}
.icon-btn:hover,
.light-btn:hover,
.canvas-tools button:hover {
  background: #e6eee8;
}
.search {
  background: white;
  border: 1px solid #d5ded6;
  border-radius: 7px;
  display: flex;
  align-items: center;
  padding: 7px 9px;
  gap: 7px;
  color: var(--muted);
  margin-bottom: 10px;
}
.search i {
  width: 15px;
}
.search input {
  background: none;
  border: 0;
  min-width: 0;
  width: 100%;
  font-size: 13px;
}
.search input:focus {
  outline: 0;
}
.search:focus-within {
  border-color: var(--green);
}
#tree {
  overflow: auto;
  flex: 1;
}
.tree-section {
  margin: 9px 0 3px 10px;
  font-size: 11px;
  font-weight: 650;
  color: var(--muted);
}
.nav-row {
  display: flex;
  align-items: center;
  gap: 2px;
  padding-left: calc(3px + min(var(--depth), 6) * 9px);
  margin: 2px 0;
  border-radius: 6px;
}
.nav-row.active {
  background: #dcebe1;
  color: #185d49;
}
.nav-row:hover {
  background: #e5ede6;
}
.tree-toggle,
.tree-spacer {
  width: 20px;
  flex: none;
  text-align: center;
  padding: 0;
  line-height: 30px;
  color: #62786a;
}
.tree-toggle i {
  width: 12px;
  height: 12px;
}
.tree-item {
  min-width: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  text-align: left;
  font-size: 13px;
  padding: 8px 4px 8px 0;
}
.tree-item i {
  width: 15px;
  height: 15px;
}
.tree-item span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-row.active .tree-item {
  font-weight: 650;
}
.symbol-result {
  display: block;
  width: 100%;
  padding: 7px;
  text-align: left;
  overflow-wrap: anywhere;
  font-size: 13px;
}
.symbol-result:hover, .symbol-result[aria-current="true"] {
  background: var(--mint);
}
.symbol-result small {
  display: block;
  color: var(--muted);
}
.diagnostic-button {
  border-top: 1px solid var(--line);
  padding: 15px 6px 4px;
  display: flex;
  gap: 9px;
  align-items: center;
  font-size: 13px;
}
.diagnostic-button span {
  margin-left: auto;
  font: 12px var(--mono);
  padding: 3px 7px;
  background: #e1e9e1;
  border-radius: 5px;
}
.mainpanel {
  padding: 22px clamp(15px, 2.2vw, 36px) 22px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.crumbs {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  overflow: auto;
  min-height: 22px;
  white-space: nowrap;
}
.crumbs button {
  padding: 0;
  color: var(--muted);
}
.crumbs button:hover {
  text-decoration: underline;
}
.main-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 14px 0 19px;
}
.main-title h1 {
  font-size: clamp(24px, 2.5vw, 36px);
  font-weight: 680;
  letter-spacing: -0.055em;
  overflow-wrap: anywhere;
}
.main-title p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}
.light-btn,
.form-btn {
  padding: 7px 10px;
  border: 1px solid #cfdbd3;
  border-radius: 6px;
  background: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 13px;
  white-space: nowrap;
}
.light-btn i {
  width: 14px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
#module-controls:not([hidden]) {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
#module-controls label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
#module-focus { max-width: 230px; }
#module-pages:not([hidden]) { display: flex; align-items: center; gap: 8px; font-size: 12px; }
#module-pages button { padding: 3px 9px; font-size: 17px; }
.module-title { margin: 2px 0 10px; }
.module-site { padding: 12px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.module-site > strong { font: 600 12px var(--mono); }
.module-site h4 { margin: 11px 0 4px; color: var(--muted); font-size: 12px; }
.module-site .condition { margin: 4px 0; white-space: pre-wrap; }
.tabs button {
  padding: 8px 12px 11px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 14px;
}
.tabs button.active {
  color: var(--green);
  font-weight: 650;
}
.tabs button.active:after {
  content: "";
  height: 3px;
  position: absolute;
  bottom: -1px;
  left: 8px;
  right: 8px;
  background: #28745c;
  border-radius: 2px;
}
.tabs i {
  width: 15px;
}
#generation-feedback {
  margin: 0 0 12px;
  padding: 10px 14px;
  border: 1px solid #c3d8c9;
  border-radius: 8px;
  background: #f2f8f3;
  font-size: 12px;
}
#generation-feedback[data-status="failed"] {
  background: #fff7ee;
  border-color: #dfc2a6;
}
.generation-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 12px; }
#generation-count, #generation-batches { color: var(--muted); }
#generation-progress { display: block; width: 100%; height: 7px; margin: 8px 0 3px; accent-color: var(--green); }
#generation-batches { margin: 4px 0 0; padding: 0; max-height: 6.5em; overflow: auto; list-style: none; overflow-wrap: anywhere; }
#generation-batches:empty { display: none; }
#generation-error, #generation-connection { margin: 5px 0; overflow-wrap: anywhere; }
#generation-error { color: #843d22; }
#generation-actions { margin-top: 8px; }
#generation-actions button + button { margin-left: 8px; }
#shared-calls {
  margin: 0 0 10px;
  border-bottom: 1px solid var(--line);
  padding: 3px 0 8px;
}
#shared-calls h2 {
  margin: 0 0 3px;
  font-size: 13px;
}
#shared-list {
  max-height: 18vh;
  overflow: auto;
  font-size: 12px;
}
.shared-target > summary {
  cursor: pointer;
  padding: 4px 0;
  color: var(--green);
}
.shared-target ol {
  margin: 0 0 6px 17px;
  padding-left: 15px;
}
.shared-target li {
  padding: 2px 0;
}
.shared-target .text-btn {
  margin: 0 0 0 6px;
  overflow-wrap: anywhere;
}
.diagram {
  flex: 1;
  min-height: 0;
  border: 1px solid #ccd9cf;
  border-radius: 11px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: white;
}
.diagram-head,
.canvas-foot {
  padding: 12px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}
.diagram-head {
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
#canvas-count {
  margin-left: auto;
}
#call-range[hidden] {
  display: none;
}
.diagram-head strong,
.canvas-foot > span:first-child {
  display: flex;
  align-items: center;
  gap: 7px;
}
.diagram-head strong {
  font-size: 13px;
  color: #334b40;
}
.live-dot {
  background: #4d8569;
}
.canvas {
  position: relative;
  flex: 1;
  overflow: hidden;
  background-color: #f8faf6;
  background-image: radial-gradient(#cbd7cb 1px, transparent 1px);
  background-size: 17px 17px;
  min-height: 200px;
}
.canvas > svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
}
.canvas-tools {
  position: absolute;
  left: 12px;
  bottom: 12px;
  background: #fff;
  display: flex;
  gap: 1px;
  align-items: center;
  border: 1px solid #d0dbd1;
  border-radius: 8px;
  padding: 3px;
  box-shadow: 0 2px 7px #2345200b;
}
.canvas-tools button {
  border-radius: 4px;
  padding: 0;
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  color: #526b5b;
}
.canvas-tools button.active {
  background: #deece1;
  color: #165c44;
}
.canvas-tools i {
  width: 15px;
}
.canvas-tools b {
  height: 16px;
  width: 1px;
  background: var(--line);
  margin: 0 3px;
}
#zoom-label {
  font: 11px var(--mono);
  min-width: 35px;
  text-align: center;
}
.canvas-foot {
  border-top: 1px solid var(--line);
  padding: 8px 13px;
}
.canvas-foot i {
  width: 14px;
}
.canvas-foot #selection-count {
  color: var(--green);
  white-space: nowrap;
}
#empty-graph {
  position: absolute;
  inset: 35% 16px auto;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}
#empty-graph .generate-in-canvas { display: block; margin: 12px auto; pointer-events: auto; }
#drawing.pan {
  cursor: grab;
}
#drawing.select {
  cursor: crosshair;
}
.graph-node,
.graph-edge {
  cursor: pointer;
}
.graph-node .card {
  fill: #fff;
  stroke: #b8cbbc;
  stroke-width: 1.4;
}
.graph-node .accent {
  fill: #deeee1;
}
.graph-node.selected .card,
.graph-node:focus .card {
  stroke: #227357;
  stroke-width: 2.5;
}
.graph-node.selected .accent {
  fill: #bce1c8;
}
.graph-node:hover .card {
  stroke: #54826a;
}
.graph-node text,
.graph-edge text {
  pointer-events: none;
}
.graph-node .kind {
  font-size: 11px;
  fill: #446953;
  font-weight: 650;
}
.graph-node .name {
  font-size: 15px;
  fill: #1e352a;
  font-weight: 650;
}
.graph-node .detail {
  font: 11px var(--mono);
  fill: #5c7164;
}
.graph-edge .edge-path {
  fill: none;
  stroke: #8ba391;
  stroke-width: 1.6;
}
.graph-edge .site-count { fill: #f5faf6; stroke: #c6d8cb; }
.graph-edge .site-count + text { stroke: none; }
.graph-edge.picked .site-count, .graph-edge:hover .site-count { fill: #deeee1; stroke: #54826a; }
.graph-edge:focus { outline: none; }
.graph-edge:focus-visible .edge-path { stroke: #22654e; stroke-width: 3; }
.graph-edge:hover .edge-path,
.graph-edge.picked .edge-path {
  stroke: #276548;
  stroke-width: 3;
}
.edge-hit {
  stroke: transparent;
  stroke-width: 15;
  fill: none;
}
.graph-edge text {
  fill: #405c4c;
  stroke: #f8faf6;
  stroke-width: 4;
  paint-order: stroke;
  font-size: 11px;
}
.graph-edge[data-key] text {
  pointer-events: all;
}
.rubber {
  fill: #459c7826;
  stroke: #35785d;
  stroke-dasharray: 5 3;
  pointer-events: none;
}
.inspector {
  position: relative;
  background: #fff;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
#inspector-resizer {
  position: absolute;
  z-index: 1;
  inset: 0 auto 0 -7px;
  width: 14px;
  display: grid;
  place-items: center;
  cursor: col-resize;
  touch-action: none;
  user-select: none;
}
#inspector-resizer::after {
  content: "";
  width: 4px;
  height: 36px;
  border-radius: 3px;
  background: #9eb3a9;
}
#inspector-resizer:is(:hover, :focus-visible, .dragging)::after { background: var(--green); }
#inspector-resizer:is(:hover, :focus-visible, .dragging) {
  background: linear-gradient(to right, transparent 6px, #659781 6px 8px, transparent 8px);
}
.inspector-header {
  justify-content: flex-start;
  gap: 8px;
  padding: 25px 17px 17px;
}
.inspector-header i {
  color: var(--green);
}
#generate-semantics {
  margin-left: auto;
  font-size: 12px;
}
.business-reading {
  padding: 12px;
  border: 1px solid #d9e3d7;
  border-left: 3px solid #779870;
  border-radius: 6px;
  background: #f5f8f2;
  overflow-wrap: anywhere;
}
.reading-source, .reading-coverage {
  font-size: 11px;
  color: #4e675d;
}
.business-reading h3 {
  font-size: 16px;
  margin: 6px 0;
}
.reading-text {
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-line;
}
.reading-claim + .reading-claim {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 4px;
}
.reading-claim .proof {
  margin: 4px 0;
}
.claim-refs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
}
.claim-refs .text-btn {
  margin: 0;
  overflow-wrap: anywhere;
  text-align: left;
}
.reading-coverage {
  display: block;
  margin-top: 7px;
}
.reading-citations {
  margin-top: 9px;
  font-size: 12px;
}
.reading-citations > summary {
  cursor: pointer;
  color: var(--green);
}
.reading-anchor {
  margin-top: 7px;
}
.reading-anchor .source-line {
  min-width: 0;
}
.reading-anchor .source-line b {
  flex: none;
  white-space: nowrap;
}
.reading-anchor .source-line code {
  min-width: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.inspect-tabs {
  margin: 0 14px 12px;
  display: flex;
  padding: 3px;
  background: #f1f4f0;
  border-radius: 7px;
}
.inspect-tabs button {
  flex: 1;
  font-size: 13px;
  color: var(--muted);
  padding: 6px;
  border-radius: 5px;
}
.inspect-tabs button.active {
  background: white;
  color: #254735;
  font-weight: 650;
  box-shadow: 0 1px 3px #2b423018;
}
.inspect-content {
  overflow: auto;
  padding: 3px 16px 22px;
  flex: 1;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin: 13px 0 9px;
}
.section-head h3 {
  font-size: 13px;
}
.section-head span,
.subtle {
  font-size: 12px;
  color: var(--muted);
}
.subtle {
  line-height: 1.7;
}
.scope-chip {
  display: inline-block;
  background: #e9f2e9;
  color: #2c6248;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  margin: 2px 4px 2px 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.proof {
  margin: 10px 0 14px;
  border: 1px solid #d7e1d8;
  border-radius: 7px;
  overflow: hidden;
}
.proof summary {
  padding: 9px;
  background: #f1f5f1;
  cursor: pointer;
  font: 12px var(--mono);
  overflow-wrap: anywhere;
  line-height: 1.5;
}
.source-lines {
  background: #182f2b;
  color: #e0ece2;
  font: 12px/1.8 var(--mono);
  overflow: auto;
  padding: 8px 0;
  max-height: 310px;
}
.source-line {
  display: flex;
  min-width: max-content;
}
.source-line b {
  color: #a1b7aa;
  padding: 0 10px;
  min-width: 36px;
  text-align: right;
  font-weight: 400;
  user-select: none;
}
.source-line code {
  font: inherit;
  white-space: pre;
  padding-right: 8px;
}
.source-line.focus {
  background: #2e4e41;
}
.expand-source {
  display: block;
  width: 100%;
  text-align: center;
  padding: 6px;
  color: var(--green);
  font-size: 12px;
}
.relation-row {
  width: 100%;
  overflow-wrap: anywhere;
  text-align: left;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.relation-row:hover {
  text-decoration: underline;
}
.note-form,
.chat-form {
  margin: 10px 0;
  display: grid;
  gap: 8px;
}
.inspect-content textarea,
.thread-select {
  background: white;
  border: 1px solid #cedbd1;
  border-radius: 6px;
  padding: 9px;
  line-height: 1.5;
  font-size: 13px;
  width: 100%;
  resize: vertical;
  min-height: 40px;
}
.primary {
  background: #245d47;
  color: white;
  border-color: #245d47;
}
.primary:hover {
  background: #174d39;
}
.note-card,
.message {
  padding: 10px;
  margin: 8px 0;
  border: 1px solid var(--line);
  border-radius: 7px;
}
.note-card p,
.message p,
.diag-item p {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.7;
}
.note-card footer,
.chat-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.note-card footer button,
.text-btn {
  padding: 4px 0;
  font-size: 12px;
  color: var(--green);
}
.message.user {
  background: #f0f5ef;
}
.message strong {
  font-size: 12px;
  color: var(--green);
  display: block;
  margin-bottom: 6px;
}
.message details {
  margin-top: 7px;
}
.message summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--green);
}
.availability {
  padding: 10px;
  background: #f6f4eb;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.65;
  color: #6a5935;
}
.thread-select {
  margin: 8px 0;
}
.small-empty {
  padding: 12px 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}
.dialog-title {
  margin-bottom: 12px;
}
.diag-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
dialog {
  border: 1px solid #c8d7cc;
  background: white;
  border-radius: 12px;
  width: min(640px, 95vw);
  max-height: 80vh;
  padding: 19px;
}
dialog::backdrop {
  background: #172e2870;
}
#model-settings { background: transparent; cursor: pointer; white-space: nowrap; font: inherit; font-size: 13px; }
#model-dialog { width: min(490px, 94vw); color: var(--ink); }
#model-form, #model-form label { display: grid; gap: 6px; }
#model-form { gap: 13px; }
#model-form label { font-size: 13px; }
#model-form input, #model-form select { width: 100%; min-width: 0; padding: 8px; font: inherit; border: 1px solid #bccbc1; border-radius: 6px; background: white; }
.model-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.model-actions { display: flex; justify-content: flex-end; gap: 8px; }
.model-help, #model-status, #model-offline { font-size: 13px; line-height: 1.55; }
.model-help { color: #51675a; margin: 0; }
#model-status:empty { display: none; }
#model-status { color: #884019; }
#model-dialog [hidden] { display: none; }
#toast {
  position: fixed;
  bottom: 18px;
  right: 18px;
  max-width: min(94vw, 480px);
  background: #1d392e;
  color: white;
  font-size: 14px;
  padding: 10px 15px;
  border-radius: 7px;
  z-index: 3;
  display: none;
}
#toast.show {
  display: block;
}
[hidden] {
  display: none !important;
}
@media (min-width: 1550px) {
  .workspace {
    --nav-width: 255px;
    --graph-min-width: 400px;
    --inspector-default: 365px;
  }
}
@media (max-width: 1150px) {
  .workspace {
    --nav-width: 190px;
    --graph-min-width: 280px;
    --inspector-default: 270px;
  }
  .mainpanel {
    padding: 16px 12px;
  }
  .navpanel {
    padding: 16px 8px;
  }
  .tabs button {
    padding: 8px 7px 11px;
  }
}
@media (max-width: 880px) {
  #inspector-resizer { display: none; }
  .workspace {
    grid-template-columns: 175px minmax(0, 1fr);
    height: auto;
    min-height: 0;
  }
  .navpanel {
    grid-row: span 2;
    max-height: calc(100dvh - 64px);
    position: sticky;
    top: 0;
  }
  .mainpanel {
    height: 72vh;
    min-height: 500px;
  }
  .inspector {
    border: 1px solid var(--line);
    margin: 0 12px 20px;
    border-radius: 9px;
    max-height: 650px;
  }
  .inspect-content {
    min-height: 120px;
  }
  .inspector-header {
    padding: 12px 16px;
  }
  .inspect-tabs {
    max-width: 360px;
  }
  .snapshot {
    display: none;
  }
}
@media (max-width: 590px) {
  .workspace {
    display: block;
  }
  .navpanel {
    position: static;
    max-height: 230px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    border-right: 0;
  }
  .project-summary,
  .nav-head,
  .diagnostic-button {
    display: none;
  }
  .search {
    margin-bottom: 3px;
  }
  #tree {
    max-height: 105px;
  }
  .mainpanel {
    min-height: 495px;
    height: 68vh;
  }
  .main-title {
    margin: 7px 0 9px;
  }
  .mainpanel .tabs {
    margin-bottom: 8px;
  }
  .topbar {
    padding: 0 12px;
    gap: 9px;
    height: 52px;
  }
  .brand {
    font-size: 19px;
  }
  .topbar .app-label {
    display: none;
  }
  .head-divider {
    display: none;
  }
  .diagram-head {
    padding: 8px 11px;
  }
  .canvas-foot {
    font-size: 11px;
  }
  .tabs button {
    font-size: 13px;
  }
  .canvas-tools {
    bottom: 6px;
    left: 6px;
  }
  .connection {
    font-size: 12px;
  }
}
.export-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #e4f0e8;
  text-decoration: none;
  font-size: 13px;
  padding: 5px 9px;
  border: 1px solid #527168;
  border-radius: 6px;
}
.export-link:hover {
  background: #325344;
}
.export-link i {
  width: 14px;
  height: 14px;
}

/* The same layout fills the tab when the browser declines native fullscreen. */
html.graph-fullscreen { overflow: hidden; }
.graph-fullscreen .workspace {
  --nav-width: 0px;
  --inspector-default: clamp(270px, 25vw, 365px);
  position: fixed;
  inset: 0;
  display: grid;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr);
  height: auto;
  min-height: 0;
  background: #f8faf8;
}
.graph-fullscreen .topbar,
.graph-fullscreen .navpanel,
.graph-fullscreen .crumbs,
.graph-fullscreen .main-title p,
.graph-fullscreen #shared-calls,
.graph-fullscreen:not(.graph-inspecting) .inspector { display: none; }
.graph-fullscreen.graph-inspecting .workspace {
  grid-template-columns: minmax(0, 1fr) var(--inspector-track);
}
.graph-fullscreen .inspector {
  margin: 0;
  max-height: none;
  border-radius: 0;
}
.graph-fullscreen .mainpanel {
  display: grid;
  grid-template: auto auto minmax(0, 1fr) / minmax(0, 1fr) auto;
  height: auto;
  min-height: 0;
  padding: 0;
}
.graph-fullscreen .main-title {
  grid-area: 1 / 1;
  justify-content: flex-start;
  margin: 0;
  padding: 6px 12px;
}
.graph-fullscreen .main-title > div { min-width: 0; }
.graph-fullscreen .main-title h1 {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 16px;
  letter-spacing: normal;
}
.graph-fullscreen .mainpanel .tabs {
  grid-area: 1 / 2;
  margin: 0;
  border: 0;
}
.graph-fullscreen #generation-feedback { grid-area: 2 / 1 / 3 / -1; margin: 0; }
.graph-fullscreen .diagram {
  grid-area: 3 / 1 / 4 / -1;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
}
.graph-fullscreen .canvas { min-height: 0; }
#fullscreen-inspector[aria-expanded="true"] { background: var(--mint); color: var(--green); }
@media (max-width: 880px) {
  .graph-fullscreen .mainpanel { display: flex; }
  .graph-fullscreen.graph-inspecting .workspace {
    grid-template: minmax(0, 1fr) 38% / minmax(0, 1fr);
  }
}
.expression {
  display: block;
  overflow-wrap: anywhere;
  background: #f3f6f2;
  font: 13px/1.5 var(--mono);
  padding: 6px;
  border-radius: 4px;
}
</style>

<body>
  <header class="topbar">
    <a class="brand" href="#" id="home"><i class="brandmark" data-icon="branch"></i>How2Trust</a>
    <span class="head-divider"></span><span class="app-label">架构工作台</span>
    <span class="top-spacer"></span><button id="model-settings" type="button" class="export-link" aria-haspopup="dialog">模型设置</button><a id="review-link" class="export-link" href="/review" hidden>交付验收</a><a id="export" class="export-link" href="/export.html" download="how2trust.html" hidden><i data-icon="download"></i>导出 HTML</a><span class="connection" id="connection">正在加载</span>
    <span class="snapshot" id="snapshot"></span>
  </header>
  <main class="workspace">
    <aside class="navpanel">
      <div class="project-summary"><i data-icon="repo"></i><div><small>当前仓库</small><strong id="repo-name">…</strong></div></div>
      <div class="nav-head"><h2 id="nav-title">整仓结构</h2><button class="icon-btn" id="collapse" title="折叠目录" aria-label="折叠目录"><i data-icon="collapse"></i></button></div>
      <label class="search"><i data-icon="search"></i><input id="search" type="search" placeholder="查找模块、入口或代码符号" aria-label="查找模块、入口或代码符号"></label>
      <nav id="tree" aria-label="产品层级"></nav>
      <button id="diagnostics" class="diagnostic-button"><i data-icon="scan"></i>分析记录<span id="diag-count">0</span></button>
    </aside>
    <section class="mainpanel">
      <div id="crumbs" class="crumbs"></div>
      <div class="main-title"><div><h1 id="scope-name">仓库架构</h1><p id="metrics"></p></div><button id="up" class="light-btn"><i data-icon="up"></i><span id="up-label">上一级</span></button></div>
      <div class="tabs" id="views" aria-label="图类型">
        <button data-view="structure"><i data-icon="repo"></i>整仓结构</button>
        <button data-view="product"><i data-icon="branch"></i>生产业务</button>
        <button data-view="collaboration"><i data-icon="route"></i>模块协作</button>
        <button data-view="class"><i data-icon="class"></i>类关系图</button>
        <button data-view="call"><i data-icon="route"></i>方法调用链</button>
      </div>
      <section id="generation-feedback" aria-label="生产业务图生成进度" hidden>
        <div class="generation-heading"><strong id="generation-stage" role="status"></strong><span id="generation-count"></span></div>
        <progress id="generation-progress" aria-label="生成生产业务图"></progress>
        <ul id="generation-batches"></ul>
        <p id="generation-connection" hidden>暂时无法取得最新进度，正在重新连接…</p>
        <p id="generation-error" role="alert" hidden></p>
        <div id="generation-actions" hidden><button type="button" class="light-btn" id="generation-retry">重试生成</button><button type="button" class="text-btn" id="generation-settings">调整模型设置</button></div>
      </section>
      <section id="shared-calls" aria-label="多个入口共用的实现" hidden>
        <h2>多个入口共用的实现</h2>
        <div id="shared-list"></div>
      </section>
      <section class="diagram">
        <div id="module-controls" hidden>
          <label>模块 <select id="module-focus" class="light-btn"></select></label>
          <label>范围 <select id="module-direction" class="light-btn"><option value="out">它调用谁</option><option value="in">谁调用它</option><option value="all">全部模块</option></select></label>
          <div id="module-pages" hidden><button id="module-prev" class="light-btn" aria-label="上一页关系">‹</button><span id="module-page"></span><button id="module-next" class="light-btn" aria-label="下一页关系">›</button></div>
        </div>
        <div class="diagram-head"><strong><span class="live-dot"></span><span id="canvas-name">产品结构图</span></strong>
          <select id="root-layer" aria-label="首页图层" class="light-btn" hidden></select>
          <span id="canvas-count"></span><button id="call-range" class="light-btn" hidden></button>
          <button type="button" id="fullscreen-inspector" class="light-btn" aria-controls="graph-inspector" aria-expanded="false" hidden><i data-icon="panel"></i>检查器</button>
          <button type="button" id="fullscreen" class="light-btn" aria-controls="canvas" aria-pressed="false"><i data-icon="expand"></i><span>全屏查看</span></button>
        </div>
        <div class="canvas" id="canvas">
          <svg id="drawing" aria-label="可交互架构图" role="group"></svg>
          <div id="empty-graph" hidden></div>
          <div class="canvas-tools">
            <button id="pan" title="拖动画布" aria-label="拖动画布"><i data-icon="hand"></i></button>
            <button id="select" title="拖出矩形圈选节点" aria-label="拖出矩形圈选节点"><i data-icon="select"></i></button>
            <b></b>
            <button id="minus" title="缩小" aria-label="缩小"><i data-icon="minus"></i></button><span id="zoom-label"></span>
            <button id="plus" title="放大" aria-label="放大"><i data-icon="plus"></i></button>
            <button id="fit" title="适应画布" aria-label="适应画布"><i data-icon="fit"></i></button>
          </div>
        </div>
        <div class="canvas-foot"><span><i data-icon="pointer"></i><span id="canvas-hint">点击模块展开</span></span><span id="selection-count"></span></div>
      </section>
    </section>
    <aside class="inspector" id="graph-inspector">
      <div id="inspector-resizer" role="separator" tabindex="0" aria-orientation="vertical"
           aria-label="调整检查器宽度" aria-controls="graph-inspector"
           title="左右拖动或按方向键调整宽度，双击或按回车恢复默认宽度"></div>
      <div class="inspector-header"><i data-icon="panel"></i><h2>检查器</h2><button id="generate-semantics" type="button" class="light-btn" hidden>生成业务解读</button></div>
      <div class="inspect-tabs" id="inspect-tabs"><button data-inspect="evidence">源码</button><button data-inspect="notes">批注</button><button data-inspect="chat">问答</button></div>
      <div class="inspect-content" id="inspect-content"></div>
    </aside>
  </main>
  <dialog id="diag-dialog"><div class="dialog-title"><h2>分析记录</h2><button class="icon-btn" id="diag-close" aria-label="关闭"><i data-icon="close"></i></button></div><div id="diag-list"></div></dialog>
  <dialog id="model-dialog" aria-labelledby="model-title">
    <div class="dialog-title"><h2 id="model-title">模型设置</h2><button class="icon-btn" id="model-close" aria-label="关闭模型设置"><i data-icon="close"></i></button></div>
    <p id="model-offline" hidden>这是离线快照。将源码目录拖到 How2Trust.cmd，在打开的本地工作台右上角点「模型设置」，即可配置模型并提问。</p>
    <p id="model-status" role="status" aria-live="polite"></p>
    <form id="model-form" hidden>
      <label>应用范围<select id="model-stage"><option value="both">业务解读和图上问答</option><option value="semantics">仅业务解读</option><option value="chat">仅图上问答</option></select></label>
      <div class="model-row"><label>供应商名称<input id="model-provider" list="provider-choices" placeholder="选择或输入名称"></label>
        <datalist id="provider-choices"><option value="DeepSeek"></option><option value="Ollama"></option><option value="Anthropic"></option></datalist>
        <label>接口协议<select id="model-protocol"><option value="openai">Chat Completions 兼容</option><option value="anthropic">Anthropic Messages</option></select></label></div>
      <label>API 基础地址<input id="model-url" type="url" required placeholder="https://api.deepseek.com"></label>
      <label>模型名<input id="model-name" required placeholder="供应商 API 使用的模型名"></label>
      <label>鉴权方式<select id="model-auth"><option value="env">使用本机环境变量</option><option value="session">粘贴 API Key（本次服务有效）</option><option value="none">无需密钥</option></select></label>
      <label id="model-env-field">密钥环境变量名<input id="model-env" placeholder="DEEPSEEK_API_KEY" spellcheck="false"></label>
      <label id="model-secret-field" hidden>API Key<input id="model-secret" type="password" autocomplete="off" spellcheck="false"></label>
      <p class="model-help">保存后即时生效，下次直接打开工作台会沿用设置。粘贴的密钥在关闭本地服务后清除。</p>
      <div class="model-actions"><button class="form-btn" id="model-cancel" type="button">取消</button><button class="form-btn primary" id="model-save" type="submit">保存并应用</button></div>
    </form>
  </dialog>

env_outside_zip_file_when_called_in_zipfile"},{"column":1,"end":16,"file":"tests/test_zip_imports.py","id":"edge:82a86e1c070c96b7525d690f","kind":"contains","line":10,"source":"module:tests/test_zip_imports.py","target":"function:tests/test_zip_imports.py:walk_to_root"}],"fileRoles":{"CHANGELOG.md":"production","CONTRIBUTING.md":"production","README.md":"production","docs/changelog.md":"example","docs/contributing.md":"example","docs/index.md":"example","docs/license.md":"example","docs/reference.md":"example","mkdocs.yml":"production","requirements-docs.txt":"production","requirements.txt":"production","setup.py":"production","src/dotenv/__init__.py":"production","src/dotenv/__main__.py":"production","src/dotenv/cli.py":"production","src/dotenv/ipython.py":"production","src/dotenv/main.py":"production","src/dotenv/parser.py":"production","src/dotenv/variables.py":"production","src/dotenv/version.py":"production","tests/__init__.py":"test","tests/conftest.py":"test","tests/test_cli.py":"test","tests/test_ipython.py":"test","tests/test_is_interactive.py":"test","tests/test_main.py":"test","tests/test_parser.py":"test","tests/test_utils.py":"test","tests/test_variables.py":"test","tests/test_zip_imports.py":"test","tox.ini":"production"},"files":{"CHANGELOG.md":"# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and this\nproject adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n## [1.1.1] - 2025-06-24\n\n## Fixed\n\n* CLI: Ensure `find_dotenv` work reliably on python 3.13 by [@theskumar] in [#563](https://github.com/theskumar/python-dotenv/pull/563)\n* CLI: revert the use of execvpe on Windows by [@wrongontheinternet] in [#566](https://github.com/theskumar/python-dotenv/pull/566)\n\n\n## [1.1.0] - 2025-03-25\n\n**Feature**\n\n- Add support for python 3.13\n- Enhance `dotenv run`, switch to `execvpe` for better resource management and signal handling ([#523]) by [@eekstunt]\n\n**Fixed**\n\n- `find_dotenv` and `load_dotenv` now correctly looks up at the current directory when running in debugger or pdb ([#553] by [@randomseed42])\n\n**Misc**\n\n- Drop support for Python 3.8\n\n## [1.0.1] - 2024-01-23\n\n**Fixed**\n\n* Gracefully handle code which has been imported from a zipfile ([#456] by [@samwyma])\n* Allow modules using `load_dotenv` to be reloaded when launched in a separate thread ([#497] by [@freddyaboulton])\n* Fix file not closed after deletion, handle error in the rewrite function ([#469] by [@Qwerty-133])\n\n**Misc**\n* Use pathlib.Path in tests ([#466] by [@eumiro])\n* Fix year in release date in changelog.md ([#454] by [@jankislinger])\n* Use https in README links ([#474] by [@Nicals])\n\n## [1.0.0] - 2023-02-24\n\n**Fixed**\n\n* Drop support for python 3.7, add python 3.12-dev (#449 by [@theskumar])\n* Handle situations where the cwd does not exist. (#446 by [@jctanner])\n\n## [0.21.1] - 2023-01-21\n\n**Added**\n\n* Use Python 3.11 non-beta in CI (#438 by [@bbc2])\n* Modernize variables code (#434 by [@Nougat-Waffle])\n* Modernize main.py and parser.py code (#435 by [@Nougat-Waffle])\n* Improve conciseness of cli.py and __init__.py (#439 by [@Nougat-Waffle])\n* Improve error message for `get` and `list` commands when env file can't be opened (#441 by [@bbc2])\n* Updated License to align with BSD OSI template (#433 by [@lsmith77])\n\n\n**Fixed**\n\n* Fix Out-of-scope error when \"dest\" variable is undefined (#413 by [@theGOTOguy])\n* Fix IPython test warning about deprecated `magic` (#440 by [@bbc2])\n* Fix type hint for dotenv_path var, add StrPath alias (#432 by [@eaf])\n\n## [0.21.0] - 2022-09-03\n\n**Added**\n\n* CLI: add support for invocations via 'python -m'. (#395 by [@theskumar])\n* `load_dotenv` function now returns `False`. (#388 by [@larsks])\n* CLI: add --format= option to list command. (#407 by [@sammck])\n\n**Fixed**\n\n* Drop Python 3.5 and 3.6 and upgrade GA (#393 by [@eggplants])\n* Use `open` instead of `io.open`. (#389 by [@rabinadk1])\n* Improve documentation for variables without a value (#390 by [@bbc2])\n* Add `parse_it` to Related Projects (#410 by [@naorlivne])\n* Update README.md (#415 by [@harveer07])\n* Improve documentation with direct use of MkDocs (#398 by [@bbc2])\n\n## [0.20.0] - 2022-03-24\n\n**Added**\n\n- Add `encoding` (`Optional[str]`) parameter to `get_key`, `set_key` and `unset_key`.\n  (#379 by [@bbc2])\n\n**Fixed**\n\n- Use dict to specify the `entry_points` parameter of `setuptools.setup` (#376 by\n  [@mgorny]).\n- Don't build universal wheels (#387 by [@bbc2]).\n\n## [0.19.2] - 2021-11-11\n\n**Fixed**\n\n- In `set_key`, add missing newline character before new entry if necessary. (#361 by\n  [@bbc2])\n\n## [0.19.1] - 2021-08-09\n\n**Added**\n\n- Add support for Python 3.10. (#359 by [@theskumar])\n\n## [0.19.0] - 2021-07-24\n\n**Changed**\n\n- Require Python 3.5 or a later version.  Python 2 and 3.4 are no longer supported. (#341\n  by [@bbc2]).\n\n**Added**\n\n- The `dotenv_path` argument of `set_key` and `unset_key` now has a type of `Union[str,\n  os.PathLike]` instead of just `os.PathLike` (#347 by [@bbc2]).\n- The `stream` argument of `load_dotenv` and `dotenv_values` can now be a text stream\n  (`IO[str]`), which includes values like `io.StringIO(\"foo\")` and `open(\"file.env\",\n  \"r\")` (#348 by [@bbc2]).\n\n## [0.18.0] - 2021-06-20\n\n**Changed**\n\n- Raise `ValueError` if `quote_mode` isn't one of `always`, `auto` or `never` in\n  `set_key` (#330 by [@bbc2]).\n- When writing a value to a .env file with `set_key` or `dotenv set \u003ckey\u003e \u003cvalue\u003e` (#330\n  by [@bbc2]):\n  - Use single quotes instead of double quotes.\n  - Don't strip surrounding quotes.\n  - In `auto` mode, don't add quotes if the value is only made of alphanumeric characters\n    (as determined by `string.isalnum`).\n\n## [0.17.1] - 2021-04-29\n\n**Fixed**\n\n- Fixed tests for build environments relying on `PYTHONPATH` (#318 by [@befeleme]).\n\n## [0.17.0] - 2021-04-02\n\n**Changed**\n\n- Make `dotenv get \u003ckey\u003e` only show the value, not `key=value` (#313 by [@bbc2]).\n\n**Added**\n\n- Add `--override`/`--no-override` option to `dotenv run` (#312 by [@zueve] and [@bbc2]).\n\n## [0.16.0] - 2021-03-27\n\n**Changed**\n\n- The default value of the `encoding` parameter for `load_dotenv` and `dotenv_values` is\n  now `\"utf-8\"` instead of `None` (#306 by [@bbc2]).\n- Fix resolution order in variable expansion with `override=False` (#287 by [@bbc2]).\n\n## [0.15.0] - 2020-10-28\n\n**Added**\n\n- Add `--export` option to `set` to make it prepend the binding with `export` (#270 by\n  [@jadutter]).\n\n**Changed**\n\n- Make `set` command create the `.env` file in the current directory if no `.env` file was\n  found (#270 by [@jadutter]).\n\n**Fixed**\n\n- Fix potentially empty expanded value for duplicate key (#260 by [@bbc2]).\n- Fix import error on Python 3.5.0 and 3.5.1 (#267 by [@gongqingkui]).\n- Fix parsing of unquoted values containing several adjacent space or tab characters\n  (#277 by [@bbc2], review by [@x-yuri]).\n\n## [0.14.0] - 2020-07-03\n\n**Changed**\n\n- Privilege definition in file over the environment in variable expansion (#256 by\n  [@elbehery95]).\n\n**Fixed**\n\n- Improve error message for when file isn't found (#245 by [@snobu]).\n- Use HTTPS URL in package meta data (#251 by [@ekohl]).\n\n## [0.13.0] - 2020-04-16\n\n**Added**\n\n- Add support for a Bash-like default value in variable expansion (#248 by [@bbc2]).\n\n## [0.12.0] - 2020-02-28\n\n**Changed**\n\n- Use current working directory to find `.env` when bundled by PyInstaller (#213 by\n  [@gergelyk]).\n\n**Fixed**\n\n- Fix escaping of quoted values written by `set_key` (#236 by [@bbc2]).\n- Fix `dotenv run` crashing on environment variables without values (#237 by [@yannham]).\n- Remove warning when last line is empty (#238 by [@bbc2]).\n\n## [0.11.0] - 2020-02-07\n\n**Added**\n\n- Add `interpolate` argument to `load_dotenv` and `dotenv_values` to disable interpolation\n  (#232 by [@ulyssessouza]).\n\n**Changed**\n\n- Use logging instead of warnings (#231 by [@bbc2]).\n\n**Fixed**\n\n- Fix installation in non-UTF-8 environments (#225 by [@altendky]).\n- Fix PyPI classifiers (#228 by [@bbc2]).\n\n## [0.10.5] - 2020-01-19\n\n**Fixed**\n\n- Fix handling of malformed lines and lines without a value (#222 by [@bbc2]):\n  - Don't print warning when key has no value.\n  - Reject more malformed lines (e.g. \"A: B\", \"a='b',c\").\n- Fix handling of lines with just a comment (#224 by [@bbc2]).\n\n## [0.10.4] - 2020-01-17\n\n**Added**\n\n- Make typing optional (#179 by [@techalchemy]).\n- Print a warning on malformed line (#211 by [@bbc2]).\n- Support keys without a value (#220 by [@ulyssessouza]).\n\n## 0.10.3\n\n- Improve interactive mode detection ([@andrewsmith])([#183]).\n- Refactor parser to fix parsing inconsistencies ([@bbc2])([#170]).\n  - Interpret escapes as control characters only in double-quoted strings.\n  - Interpret `#` as start of comment only if preceded by whitespace.\n\n## 0.10.2\n\n- Add type hints and expose them to users ([@qnighy])([#172])\n- `load_dotenv` and `dotenv_values` now accept an `encoding` parameter, defaults to `None`\n  ([@theskumar])([@earlbread])([#161])\n- Fix `str`/`unicode` inconsistency in Python 2: values are always `str` now. ([@bbc2])([#121])\n- Fix Unicode error in Python 2, introduced in 0.10.0. ([@bbc2])([#176])\n\n## 0.10.1\n- Fix parsing of variable without a value ([@asyncee])([@bbc2])([#158])\n\n## 0.10.0\n\n- Add support for UTF-8 in unquoted values ([@bbc2])([#148])\n- Add support for trailing comments ([@bbc2])([#148])\n- Add backslashes support in values ([@bbc2])([#148])\n- Add support for newlines in values ([@bbc2])([#148])\n- Force environment variables to str with Python2 on Windows ([@greyli])\n- Drop Python 3.3 support ([@greyli])\n- Fix stderr/-out/-in redirection ([@venthur])\n\n\n## 0.9.0\n\n- Add `--version` parameter to cli ([@venthur])\n- Enable loading from current directory ([@cjauvin])\n- Add 'dotenv run' command for calling arbitrary shell script with .env ([@venthur])\n\n## 0.8.1\n\n-   Add tests for docs ([@Flimm])\n-   Make 'cli' support optional. Use `pip install python-dotenv[cli]`. ([@theskumar])\n\n## 0.8.0\n\n-   `set_key` and `unset_key` only modified the affected file instead of\n    parsing and re-writing file, this causes comments and other file\n    entact as it is.\n-   Add support for `export` prefix in the line.\n-   Internal refractoring ([@theskumar])\n-   Allow `load_dotenv` and `dotenv_values` to work with `StringIO())` ([@alanjds])([@theskumar])([#78])\n\n## 0.7.1\n\n-   Remove hard dependency on iPython ([@theskumar])\n\n## 0.7.0\n\n-   Add support to override system environment variable via .env.\n    ([@milonimrod](https://github.com/milonimrod))\n    ([\\#63](https://github.com/theskumar/python-dotenv/issues/63))\n-   Disable \".env not found\" warning by default\n    ([@maxkoryukov](https://github.com/maxkoryukov))\n    ([\\#57](https://github.com/theskumar/python-dotenv/issues/57))\n\n## 0.6.5\n\n-   Add support for special characters `\\`.\n    ([@pjona](https://github.com/pjona))\n    ([\\#60](https://github.com/theskumar/python-dotenv/issues/60))\n\n## 0.6.4\n\n-   Fix issue with single quotes ([@Flimm])\n    ([\\#52](https://github.com/theskumar/python-dotenv/issues/52))\n\n## 0.6.3\n\n-   Handle unicode exception in setup.py\n    ([\\#46](https://github.com/theskumar/python-dotenv/issues/46))\n\n## 0.6.2\n\n-   Fix dotenv list command ([@ticosax](https://github.com/ticosax))\n-   Add iPython Support\n    ([@tillahoffmann](https://github.com/tillahoffmann))\n\n## 0.6.0\n\n-   Drop support for Python 2.6\n-   Handle escaped characters and newlines in quoted values. (Thanks\n    [@iameugenejo](https://github.com/iameugenejo))\n-   Remove any spaces around unquoted key/value. (Thanks\n    [@paulochf](https://github.com/paulochf))\n-   Added POSIX variable expansion. (Thanks\n    [@hugochinchilla](https://github.com/hugochinchilla))\n\n## 0.5.1\n\n-   Fix `find_dotenv` - it now start search from the file where this\n    function is called from.\n\n## 0.5.0\n\n-   Add `find_dotenv` method that will try to find a `.env` file.\n    (Thanks [@isms](https://github.com/isms))\n\n## 0.4.0\n\n-   cli: Added `-q/--quote` option to control the behaviour of quotes\n    around values in `.env`. (Thanks\n    [@hugochinchilla](https://github.com/hugochinchilla)).\n-   Improved test coverage.\n\n[#78]: https://github.com/theskumar/python-dotenv/issues/78\n[#121]: https://github.com/theskumar/python-dotenv/issues/121\n[#148]: https://github.com/theskumar/python-dotenv/issues/148\n[#158]: https://github.com/theskumar/python-dotenv/issues/158\n[#170]: https://github.com/theskumar/python-dotenv/issues/170\n[#172]: https://github.com/theskumar/python-dotenv/issues/172\n[#176]: https://github.com/theskumar/python-dotenv/issues/176\n[#183]: https://github.com/theskumar/python-dotenv/issues/183\n[#359]: https://github.com/theskumar/python-dotenv/issues/359\n[#469]: https://github.com/theskumar/python-dotenv/issues/469\n[#456]: https://github.com/theskumar/python-dotenv/issues/456\n[#466]: https://github.com/theskumar/python-dotenv/issues/466\n[#454]: https://github.com/theskumar/python-dotenv/issues/454\n[#474]: https://github.com/theskumar/python-dotenv/issues/474\n[#523]: https://github.com/theskumar/python-dotenv/issues/523\n[#553]: https://github.com/theskumar/python-dotenv/issues/553\n\n[@alanjds]: https://github.com/alanjds\n[@altendky]: https://github.com/altendky\n[@andrewsmith]: https://github.com/andrewsmith\n[@asyncee]: https://github.com/asyncee\n[@bbc2]: https://github.com/bbc2\n[@befeleme]: https://github.com/befeleme\n[@cjauvin]: https://github.com/cjauvin\n[@eaf]: https://github.com/eaf\n[@earlbread]: https://github.com/earlbread\n[@eekstunt]: https://github.com/eekstunt\n[@eggplants]: https://github.com/@eggplants\n[@ekohl]: https://github.com/ekohl\n[@elbehery95]: https://github.com/elbehery95\n[@eumiro]: https://github.com/eumiro\n[@Flimm]: https://github.com/Flimm\n[@freddyaboulton]: https://github.com/freddyaboulton\n[@gergelyk]: https://github.com/gergelyk\n[@gongqingkui]: https://github.com/gongqingkui\n[@greyli]: https://github.com/greyli\n[@harveer07]: https://github.com/@harveer07\n[@jadutter]: https://github.com/jadutter\n[@jankislinger]: https://github.com/jankislinger\n[@jctanner]: https://github.com/jctanner\n[@larsks]: https://github.com/@larsks\n[@lsmith77]: https://github.com/lsmith77\n[@mgorny]: https://github.com/mgorny\n[@naorlivne]: https://github.com/@naorlivne\n[@Nicals]: https://github.com/Nicals\n[@Nougat-Waffle]: https://github.com/Nougat-Waffle\n[@qnighy]: https://github.com/qnighy\n[@Qwerty-133]: https://github.com/Qwerty-133\n[@rabinadk1]: https://github.com/@rabinadk1\n[@sammck]: https://github.com/@sammck\n[@samwyma]: https://github.com/samwyma\n[@snobu]: https://github.com/snobu\n[@techalchemy]: https://github.com/techalchemy\n[@theGOTOguy]: https://github.com/theGOTOguy\n[@theskumar]: https://github.com/theskumar\n[@ulyssessouza]: https://github.com/ulyssessouza\n[@venthur]: https://github.com/venthur\n[@x-yuri]: https://github.com/x-yuri\n[@yannham]: https://github.com/yannham\n[@zueve]: https://github.com/zueve\n[@randomseed42]: https://github.com/zueve\n[@wrongontheinternet]: https://github.com/wrongontheinternet\n\n[Unreleased]: https://github.com/theskumar/python-dotenv/compare/v1.1.1...HEAD\n[1.1.1]: https://github.com/theskumar/python-dotenv/compare/v1.1.0...1.1.1\n[1.1.0]: https://github.com/theskumar/python-dotenv/compare/v1.0.1...v1.1.0\n[1.0.1]: https://github.com/theskumar/python-dotenv/compare/v1.0.0...v1.0.1\n[1.0.0]: https://github.com/theskumar/python-dotenv/compare/v0.21.0...v1.0.0\n[0.21.1]: https://github.com/theskumar/python-dotenv/compare/v0.21.0...v0.21.1\n[0.21.0]: https://github.com/theskumar/python-dotenv/compare/v0.20.0...v0.21.0\n[0.20.0]: https://github.com/theskumar/python-dotenv/compare/v0.19.2...v0.20.0\n[0.19.2]: https://github.com/theskumar/python-dotenv/compare/v0.19.1...v0.19.2\n[0.19.1]: https://github.com/theskumar/python-dotenv/compare/v0.19.0...v0.19.1\n[0.19.0]: https://github.com/theskumar/python-dotenv/compare/v0.18.0...v0.19.0\n[0.18.0]: https://github.com/theskumar/python-dotenv/compare/v0.17.1...v0.18.0\n[0.17.1]: https://github.com/theskumar/python-dotenv/compare/v0.17.0...v0.17.1\n[0.17.0]: https://github.com/theskumar/python-dotenv/compare/v0.16.0...v0.17.0\n[0.16.0]: https://github.com/theskumar/python-dotenv/compare/v0.15.0...v0.16.0\n[0.15.0]: https://github.com/theskumar/python-dotenv/compare/v0.14.0...v0.15.0\n[0.14.0]: https://github.com/theskumar/python-dotenv/compare/v0.13.0...v0.14.0\n[0.13.0]: https://github.com/theskumar/python-dotenv/compare/v0.12.0...v0.13.0\n[0.12.0]: https://github.com/theskumar/python-dotenv/compare/v0.11.0...v0.12.0\n[0.11.0]: https://github.com/theskumar/python-dotenv/compare/v0.10.5...v0.11.0\n[0.10.5]: https://github.com/theskumar/python-dotenv/compare/v0.10.4...v0.10.5\n[0.10.4]: https://github.com/theskumar/python-dotenv/compare/v0.10.3...v0.10.4\n","CONTRIBUTING.md":"Contributing\n============\n\nAll the contributions are welcome! Please open [an\nissue](https://github.com/theskumar/python-dotenv/issues/new) or send us\na pull request.\n\nExecuting the tests:\n\n    $ pip install -r requirements.txt\n    $ pip install -e .\n    $ flake8\n    $ pytest\n\nor with [tox](https://pypi.org/project/tox/) installed:\n\n    $ tox\n\n\nDocumentation is published with [mkdocs]():\n\n```shell\n$ pip install -r requirements-docs.txt\n$ pip install -e .\n$ mkdocs serve\n```\n\nOpen http://127.0.0.1:8000/ to view the documentation locally.\n\n","README.md":"# python-dotenv\n\n[![Build Status][build_status_badge]][build_status_link]\n[![PyPI version][pypi_badge]][pypi_link]\n\npython-dotenv reads key-value pairs from a `.env` file and can set them as environment\nvariables. It helps in the development of applications following the\n[12-factor](https://12factor.net/) principles.\n\n- [Getting Started](#getting-started)\n- [Other Use Cases](#other-use-cases)\n  * [Load configuration without altering the environment](#load-configuration-without-altering-the-environment)\n  * [Parse configuration as a stream](#parse-configuration-as-a-stream)\n  * [Load .env files in IPython](#load-env-files-in-ipython)\n- [Command-line Interface](#command-line-interface)\n- [File format](#file-format)\n  * [Multiline values](#multiline-values)\n  * [Variable expansion](#variable-expansion)\n- [Related Projects](#related-projects)\n- [Acknowledgements](#acknowledgements)\n\n## Getting Started\n\n```shell\npip install python-dotenv\n```\n\nIf your application takes its configuration from environment variables, like a 12-factor\napplication, launching it in development is not very practical because you have to set\nthose environment variables yourself.\n\nTo help you with that, you can add python-dotenv to your application to make it load the\nconfiguration from a `.env` file when it is present (e.g. in development) while remaining\nconfigurable via the environment:\n\n```python\nfrom dotenv import load_dotenv\n\nload_dotenv()  # take environment variables\n\n# Code of your application, which uses environment variables (e.g. from `os.environ` or\n# `os.getenv`) as if they came from the actual environment.\n```\n\nBy default, `load_dotenv` doesn't override existing environment variables and looks for a `.env` file in same directory as python script or searches for it incrementally higher up.\n\nTo configure the development environment, add a `.env` in the root directory of your\nproject:\n\n```\n.\n├── .env\n└── foo.py\n```\n\nThe syntax of `.env` files supported by python-dotenv is similar to that of Bash:\n\n```bash\n# Development settings\nDOMAIN=example.org\nADMIN_EMAIL=admin@${DOMAIN}\nROOT_URL=${DOMAIN}/app\n```\n\nIf you use variables in values, ensure they are surrounded with `{` and `}`, like\n`${DOMAIN}`, as bare variables such as `$DOMAIN` are not expanded.\n\nYou will probably want to add `.env` to your `.gitignore`, especially if it contains\nsecrets like a password.\n\nSee the section \"File format\" below for more information about what you can write in a\n`.env` file.\n\n## Other Use Cases\n\n### Load configuration without altering the environment\n\nThe function `dotenv_values` works more or less the same way as `load_dotenv`, except it\ndoesn't touch the environment, it just returns a `dict` with the values parsed from the\n`.env` file.\n\n```python\nfrom dotenv import dotenv_values\n\nconfig = dotenv_values(\".env\")  # config = {\"USER\": \"foo\", \"EMAIL\": \"foo@example.org\"}\n```\n\nThis notably enables advanced configuration management:\n\n```python\nimport os\nfrom dotenv import dotenv_values\n\nconfig = {\n    **dotenv_values(\".env.shared\"),  # load shared development variables\n    **dotenv_values(\".env.secret\"),  # load sensitive variables\n    **os.environ,  # override loaded values with environment variables\n}\n```\n\n### Parse configuration as a stream\n\n`load_dotenv` and `dotenv_values` accept [streams][python_streams] via their `stream`\nargument.  It is thus possible to load the variables from sources other than the\nfilesystem (e.g. the network).\n\n```python\nfrom io import StringIO\n\nfrom dotenv import load_dotenv\n\nconfig = StringIO(\"USER=foo\\nEMAIL=foo@example.org\")\nload_dotenv(stream=config)\n```\n\n### Load .env files in IPython\n\nYou can use dotenv in IPython.  By default, it will use `find_dotenv` to search for a\n`.env` file:\n\n```python\n%load_ext dotenv\n%dotenv\n```\n\nYou can also specify a path:\n\n```python\n%dotenv relative/or/absolute/path/to/.env\n```\n\nOptional flags:\n\n- `-o` to override existing variables.\n- `-v` for increased verbosity.\n\n## Command-line Interface\n\nA CLI interface `dotenv` is also included, which helps you manipulate the `.env` file\nwithout manually opening it.\n\n```shell\n$ pip install \"python-dotenv[cli]\"\n$ dotenv set USER foo\n$ dotenv set EMAIL foo@example.org\n$ dotenv list\nUSER=foo\nEMAIL=foo@example.org\n$ dotenv list --format=json\n{\n  \"USER\": \"foo\",\n  \"EMAIL\": \"foo@example.org\"\n}\n$ dotenv run -- python foo.py\n```\n\nRun `dotenv --help` for more information about the options and subcommands.\n\n## File format\n\nThe format is not formally specified and still improves over time.  That being said,\n`.env` files should mostly look like Bash files.\n\nKeys can be unquoted or single-quoted. Values can be unquoted, single- or double-quoted.\nSpaces before and after keys, equal signs, and values are ignored. Values can be followed\nby a comment.  Lines can start with the `export` directive, which does not affect their\ninterpretation.\n\nAllowed escape sequences:\n\n- in single-quoted values: `\\\\`, `\\'`\n- in double-quoted values: `\\\\`, `\\'`, `\\\"`, `\\a`, `\\b`, `\\f`, `\\n`, `\\r`, `\\t`, `\\v`\n\n### Multiline values\n\nIt is possible for single- or double-quoted values to span multiple lines.  The following\nexamples are equivalent:\n\n```bash\nFOO=\"first line\nsecond line\"\n```\n\n```bash\nFOO=\"first line\\nsecond line\"\n```\n\n### Variable without a value\n\nA variable can have no value:\n\n```bash\nFOO\n```\n\nIt results in `dotenv_values` associating that variable name with the value `None` (e.g.\n`{\"FOO\": None}`. `load_dotenv`, on the other hand, simply ignores such variables.\n\nThis shouldn't be confused with `FOO=`, in which case the variable is associated with the\nempty string.\n\n### Variable expansion\n\npython-dotenv can interpolate variables using POSIX variable expansion.\n\nWith `load_dotenv(override=True)` or `dotenv_values()`, the value of a variable is the\nfirst of the values defined in the following list:\n\n- Value of that variable in the `.env` file.\n- Value of that variable in the environment.\n- Default value, if provided.\n- Empty string.\n\nWith `load_dotenv(override=False)`, the value of a variable is the first of the values\ndefined in the following list:\n\n- Value of that variable in the environment.\n- Value of that variable in the `.env` file.\n- Default value, if provided.\n- Empty string.\n\n## Related Projects\n\n-   [Honcho](https://github.com/nickstenning/honcho) - For managing\n    Procfile-based applications.\n-   [django-dotenv](https://github.com/jpadilla/django-dotenv)\n-   [django-environ](https://github.com/joke2k/django-environ)\n-   [django-environ-2](https://github.com/sergeyklay/django-environ-2)\n-   [django-configuration](https://github.com/jezdez/django-configurations)\n-   [dump-env](https://github.com/sobolevn/dump-env)\n-   [environs](https://github.com/sloria/environs)\n-   [dynaconf](https://github.com/rochacbruno/dynaconf)\n-   [parse_it](https://github.com/naorlivne/parse_it)\n-   [python-decouple](https://github.com/HBNetwork/python-decouple)\n\n## Acknowledgements\n\nThis project is currently maintained by [Saurabh Kumar](https://saurabh-kumar.com) and\n[Bertrand Bonnefoy-Claudet](https://github.com/bbc2) and would not have been possible\nwithout the support of these [awesome\npeople](https://github.com/theskumar/python-dotenv/graphs/contributors).\n\n[build_status_badge]: https://github.com/theskumar/python-dotenv/actions/workflows/test.yml/badge.svg\n[build_status_link]: https://github.com/theskumar/python-dotenv/actions/workflows/test.yml\n[pypi_badge]: https://badge.fury.io/py/python-dotenv.svg\n[pypi_link]: https://badge.fury.io/py/python-dotenv\n[python_streams]: https://docs.python.org/3/library/io.html\n","docs/changelog.md":"../CHANGELOG.md","docs/contributing.md":"../CONTRIBUTING.md","docs/index.md":"../README.md","docs/license.md":"../LICENSE","docs/reference.md":"# ::: dotenv\n\n","mkdocs.yml":"site_name: python-dotenv\nrepo_url: https://github.com/theskumar/python-dotenv\nedit_uri: \"\"\ntheme:\n  name: material\n  palette:\n    primary: green\n  features:\n    - toc.follow\n    - navigation.sections\n\nmarkdown_extensions:\n  - mdx_truly_sane_lists\n\nplugins:\n  - mkdocstrings\n  - search\nnav:\n  - Home: index.md\n  - Changelog: changelog.md\n  - Contributing: contributing.md\n  - Reference: reference.md\n  - License: license.md\n","requirements-docs.txt":"mdx_truly_sane_lists~=1.2\nmkdocs-include-markdown-plugin~=3.3.0\nmkdocs-material~=8.2.9\nmkdocstrings[python]~=0.18.1\nmkdocs~=1.3.0\n","requirements.txt":"black~=22.3.0\nbumpversion\nclick\nflake8\u003e=2.2.3\nipython\npytest-cov\npytest\u003e=3.9\nsh\u003e=2\ntox\ntwine\nwheel\n","setup.py":"from setuptools import setup\n\n\ndef read_files(files):\n    data = []\n    for file in files:\n        with open(file, encoding=\"utf-8\") as f:\n            data.append(f.read())\n    return \"\\n\".join(data)\n\n\nlong_description = read_files([\"README.md\", \"CHANGELOG.md\"])\n\nmeta = {}\nwith open(\"./src/dotenv/version.py\", encoding=\"utf-8\") as f:\n    exec(f.read(), meta)\n\nsetup(\n    name=\"python-dotenv\",\n    description=\"Read key-value pairs from a .env file and set them as environment variables\",\n    long_description=long_description,\n    long_description_content_type=\"text/markdown\",\n    version=meta[\"__version__\"],\n    author=\"Saurabh Kumar\",\n    author_email=\"me+github@saurabh-kumar.com\",\n    url=\"https://github.com/theskumar/python-dotenv\",\n    keywords=[\n        \"environment variables\",\n        \"deployments\",\n        \"settings\",\n        \"env\",\n        \"dotenv\",\n        \"configurations\",\n        \"python\",\n    ],\n    packages=[\"dotenv\"],\n    package_dir={\"\": \"src\"},\n    package_data={\n        \"dotenv\": [\"py.typed\"],\n    },\n    python_requires=\"\u003e=3.9\",\n    extras_require={\n        \"cli\": [\n            \"click\u003e=5.0\",\n        ],\n    },\n    entry_points={\n        \"console_scripts\": [\n            \"dotenv=dotenv.__main__:cli\",\n        ],\n    },\n    license=\"BSD-3-Clause\",\n    classifiers=[\n        \"Development Status :: 5 - Production/Stable\",\n        \"Programming Language :: Python\",\n        \"Programming Language :: Python :: 3\",\n        \"Programming Language :: Python :: 3.9\",\n        \"Programming Language :: Python :: 3.10\",\n        \"Programming Language :: Python :: 3.11\",\n        \"Programming Language :: Python :: 3.12\",\n        \"Programming Language :: Python :: 3.13\",\n        \"Programming Language :: Python :: Implementation :: PyPy\",\n        \"Intended Audience :: Developers\",\n        \"Intended Audience :: System Administrators\",\n        \"License :: OSI Approved :: BSD License\",\n        \"Operating System :: OS Independent\",\n        \"Topic :: System :: Systems Administration\",\n        \"Topic :: Utilities\",\n        \"Environment :: Web Environment\",\n    ],\n)\n","src/dotenv/__init__.py":"from typing import Any, Optional\n\nfrom .main import (dotenv_values, find_dotenv, get_key, load_dotenv, set_key,\n                   unset_key)\n\n\ndef load_ipython_extension(ipython: Any) -\u003e None:\n    from .ipython import load_ipython_extension\n    load_ipython_extension(ipython)\n\n\ndef get_cli_string(\n    path: Optional[str] = None,\n    action: Optional[str] = None,\n    key: Optional[str] = None,\n    value: Optional[str] = None,\n    quote: Optional[str] = None,\n):\n    \"\"\"Returns a string suitable for running as a shell script.\n\n    Useful for converting a arguments passed to a fabric task\n    to be passed to a `local` or `run` command.\n    \"\"\"\n    command = ['dotenv']\n    if quote:\n        command.append(f'-q {quote}')\n    if path:\n        command.append(f'-f {path}')\n    if action:\n        command.append(action)\n        if key:\n            command.append(key)\n            if value:\n                if ' ' in value:\n                    command.append(f'\"{value}\"')\n                else:\n                    command.append(value)\n\n    return ' '.join(command).strip()\n\n\n__all__ = ['get_cli_string',\n           'load_dotenv',\n           'dotenv_values',\n           'get_key',\n           'set_key',\n           'unset_key',\n           'find_dotenv',\n           'load_ipython_extension']\n","src/dotenv/__main__.py":"\"\"\"Entry point for cli, enables execution with `python -m dotenv`\"\"\"\n\nfrom .cli import cli\n\nif __name__ == \"__main__\":\n    cli()\n","src/dotenv/cli.py":"import json\nimport os\nimport shlex\nimport sys\nfrom contextlib import contextmanager\nfrom typing import Any, Dict, IO, Iterator, List, Optional\n\nif sys.platform == 'win32':\n    from subprocess import Popen\n\ntry:\n    import click\nexcept ImportError:\n    sys.stderr.write('It seems python-dotenv is not installed with cli option. \\n'\n                     'Run pip install \"python-dotenv[cli]\" to fix this.')\n    sys.exit(1)\n\nfrom .main import dotenv_values, set_key, unset_key\nfrom .version import __version__\n\n\ndef enumerate_env() -\u003e Optional[str]:\n    \"\"\"\n    Return a path for the ${pwd}/.env file.\n\n    If pwd does not exist, return None.\n    \"\"\"\n    try:\n        cwd = os.getcwd()\n    except FileNotFoundError:\n        return None\n    path = os.path.join(cwd, '.env')\n    return path\n\n\n@click.group()\n@click.option('-f', '--file', default=enumerate_env(),\n              type=click.Path(file_okay=True),\n              help=\"Location of the .env file, defaults to .env file in current working directory.\")\n@click.option('-q', '--quote', default='always',\n              type=click.Choice(['always', 'never', 'auto']),\n              help=\"Whether to quote or not the variable values. Default mode is always. This does not affect parsing.\")\n@click.option('-e', '--export', default=False,\n              type=click.BOOL,\n              help=\"Whether to write the dot file as an executable bash script.\")\n@click.version_option(version=__version__)\n@click.pass_context\ndef cli(ctx: click.Context, file: Any, quote: Any, export: Any) -\u003e None:\n    \"\"\"This script is used to set, get or unset values from a .env file.\"\"\"\n    ctx.obj = {'QUOTE': quote, 'EXPORT': export, 'FILE': file}\n\n\n@contextmanager\ndef stream_file(path: os.PathLike) -\u003e Iterator[IO[str]]:\n    \"\"\"\n    Open a file and yield the corresponding (decoded) stream.\n\n    Exits with error code 2 if the file cannot be opened.\n    \"\"\"\n\n    try:\n        with open(path) as stream:\n            yield stream\n    except OSError as exc:\n        print(f\"Error opening env file: {exc}\", file=sys.stderr)\n        exit(2)\n\n\n@cli.command()\n@click.pass_context\n@click.option('--format', default='simple',\n              type=click.Choice(['simple', 'json', 'shell', 'export']),\n              help=\"The format in which to display the list. Default format is simple, \"\n                   \"which displays name=value without quotes.\")\ndef list(ctx: click.Context, format: bool) -\u003e None:\n    \"\"\"Display all the stored key/value.\"\"\"\n    file = ctx.obj['FILE']\n\n    with stream_file(file) as stream:\n        values = dotenv_values(stream=stream)\n\n    if format == 'json':\n        click.echo(json.dumps(values, indent=2, sort_keys=True))\n    else:\n        prefix = 'export ' if format == 'export' else ''\n        for k in sorted(values):\n            v = values[k]\n            if v is not None:\n                if format in ('export', 'shell'):\n                    v = shlex.quote(v)\n                click.echo(f'{prefix}{k}={v}')\n\n\n@cli.command()\n@click.pass_context\n@click.argument('key', required=True)\n@click.argument('value', required=True)\ndef set(ctx: click.Context, key: Any, value: Any) -\u003e None:\n    \"\"\"Store the given key/value.\"\"\"\n    file = ctx.obj['FILE']\n    quote = ctx.obj['QUOTE']\n    export = ctx.obj['EXPORT']\n    success, key, value = set_key(file, key, value, quote, export)\n    if success:\n        click.echo(f'{key}={value}')\n    else:\n        exit(1)\n\n\n@cli.command()\n@click.pass_context\n@click.argument('key', required=True)\ndef get(ctx: click.Context, key: Any) -\u003e None:\n    \"\"\"Retrieve the value for the given key.\"\"\"\n    file = ctx.obj['FILE']\n\n    with stream_file(file) as stream:\n        values = dotenv_values(stream=stream)\n\n    stored_value = values.get(key)\n    if stored_value:\n        click.echo(stored_value)\n    else:\n        exit(1)\n\n\n@cli.command()\n@click.pass_context\n@click.argument('key', required=True)\ndef unset(ctx: click.Context, key: Any) -\u003e None:\n    \"\"\"Removes the given key.\"\"\"\n    file = ctx.obj['FILE']\n    quote = ctx.obj['QUOTE']\n    success, key = unset_key(file, key, quote)\n    if success:\n        click.echo(f\"Successfully removed {key}\")\n    else:\n        exit(1)\n\n\n@cli.command(context_settings={'ignore_unknown_options': True})\n@click.pass_context\n@click.option(\n    \"--override/--no-override\",\n    default=True,\n    help=\"Override variables from the environment file with those from the .env file.\",\n)\n@click.argument('commandline', nargs=-1, type=click.UNPROCESSED)\ndef run(ctx: click.Context, override: bool, commandline: List[str]) -\u003e None:\n    \"\"\"Run command with environment variables present.\"\"\"\n    file = ctx.obj['FILE']\n    if not os.path.isfile(file):\n        raise click.BadParameter(\n            f'Invalid value for \\'-f\\' \"{file}\" does not exist.',\n            ctx=ctx\n        )\n    dotenv_as_dict = {\n        k: v\n        for (k, v) in dotenv_values(file).items()\n        if v is not None and (override or k not in os.environ)\n    }\n\n    if not commandline:\n        click.echo('No command given.')\n        exit(1)\n    run_command(commandline, dotenv_as_dict)\n\n\ndef run_command(command: List[str], env: Dict[str, str]) -\u003e None:\n    \"\"\"Replace the current process with the specified command.\n\n    Replaces the current process with the specified command and the variables from `env`\n    added in the current environment variables.\n\n    Parameters\n    ----------\n    command: List[str]\n        The command and it's parameters\n    env: Dict\n        The additional environment variables\n\n    Returns\n    -------\n    None\n        This function does not return any value. It replaces the current process with the new one.\n\n    \"\"\"\n    # copy the current environment variables and add the vales from\n    # `env`\n    cmd_env = os.environ.copy()\n    cmd_env.update(env)\n\n    if sys.platform == 'win32':\n        # execvpe on Windows returns control immediately\n        # rather than once the command has finished.\n        p = Popen(command,\n                  universal_newlines=True,\n                  bufsize=0,\n                  shell=False,\n                  env=cmd_env)\n        _, _ = p.communicate()\n\n        exit(p.returncode)\n    else:\n        os.execvpe(command[0], args=command, env=cmd_env)\n","src/dotenv/ipython.py":"from IPython.core.magic import Magics, line_magic, magics_class  # type: ignore\nfrom IPython.core.magic_arguments import (argument, magic_arguments,  # type: ignore\n                                          parse_argstring)  # type: ignore\n\nfrom .main import find_dotenv, load_dotenv\n\n\n@magics_class\nclass IPythonDotEnv(Magics):\n\n    @magic_arguments()\n    @argument(\n        '-o', '--override', action='store_true',\n        help=\"Indicate to override existing variables\"\n    )\n    @argument(\n        '-v', '--verbose', action='store_true',\n        help=\"Indicate function calls to be verbose\"\n    )\n    @argument('dotenv_path', nargs='?', type=str, default='.env',\n              help='Search in increasingly higher folders for the `dotenv_path`')\n    @line_magic\n    def dotenv(self, line):\n        args = parse_argstring(self.dotenv, line)\n        # Locate the .env file\n        dotenv_path = args.dotenv_path\n        try:\n            dotenv_path = find_dotenv(dotenv_path, True, True)\n        except IOError:\n            print(\"cannot find .env file\")\n            return\n\n        # Load the .env file\n        load_dotenv(dotenv_path, verbose=args.verbose, override=args.override)\n\n\ndef load_ipython_extension(ipython):\n    \"\"\"Register the %dotenv magic.\"\"\"\n    ipython.register_magics(IPythonDotEnv)\n","src/dotenv/main.py":"import io\nimport logging\nimport os\nimport pathlib\nimport shutil\nimport sys\nimport tempfile\nfrom collections import OrderedDict\nfrom contextlib import contextmanager\nfrom typing import IO, Dict, Iterable, Iterator, Mapping, Optional, Tuple, Union\n\nfrom .parser import Binding, parse_stream\nfrom .variables import parse_variables\n\n# A type alias for a string path to be used for the paths in this file.\n# These paths may flow to `open()` and `shutil.move()`; `shutil.move()`\n# only accepts string paths, not byte paths or file descriptors. See\n# https://github.com/python/typeshed/pull/6832.\nStrPath = Union[str, \"os.PathLike[str]\"]\n\nlogger = logging.getLogger(__name__)\n\n\ndef with_warn_for_invalid_lines(mappings: Iterator[Binding]) -\u003e Iterator[Binding]:\n    for mapping in mappings:\n        if mapping.error:\n            logger.warning(\n                \"python-dotenv could not parse statement starting at line %s\",\n                mapping.original.line,\n            )\n        yield mapping\n\n\nclass DotEnv:\n    def __init__(\n        self,\n        dotenv_path: Optional[StrPath],\n        stream: Optional[IO[str]] = None,\n        verbose: bool = False,\n        encoding: Optional[str] = None,\n        interpolate: bool = True,\n        override: bool = True,\n    ) -\u003e None:\n        self.dotenv_path: Optional[StrPath] = dotenv_path\n        self.stream: Optional[IO[str]] = stream\n        self._dict: Optional[Dict[str, Optional[str]]] = None\n        self.verbose: bool = verbose\n        self.encoding: Optional[str] = encoding\n        self.interpolate: bool = interpolate\n        self.override: bool = override\n\n    @contextmanager\n    def _get_stream(self) -\u003e Iterator[IO[str]]:\n        if self.dotenv_path and os.path.isfile(self.dotenv_path):\n            with open(self.dotenv_path, encoding=self.encoding) as stream:\n                yield stream\n        elif self.stream is not None:\n            yield self.stream\n        else:\n            if self.verbose:\n                logger.info(\n                    \"python-dotenv could not find configuration file %s.\",\n                    self.dotenv_path or \".env\",\n                )\n            yield io.StringIO(\"\")\n\n    def dict(self) -\u003e Dict[str, Optional[str]]:\n        \"\"\"Return dotenv as dict\"\"\"\n        if self._dict:\n            return self._dict\n\n        raw_values = self.parse()\n\n        if self.interpolate:\n            self._dict = OrderedDict(\n                resolve_variables(raw_values, override=self.override)\n            )\n        else:\n            self._dict = OrderedDict(raw_values)\n\n        return self._dict\n\n    def parse(self) -\u003e Iterator[Tuple[str, Optional[str]]]:\n        with self._get_stream() as stream:\n            for mapping in with_warn_for_invalid_lines(parse_stream(stream)):\n                if mapping.key is not None:\n                    yield mapping.key, mapping.value\n\n    def set_as_environment_variables(self) -\u003e bool:\n        \"\"\"\n        Load the current dotenv as system environment variable.\n        \"\"\"\n        if not self.dict():\n            return False\n\n        for k, v in self.dict().items():\n            if k in os.environ and not self.override:\n                continue\n            if v is not None:\n                os.environ[k] = v\n\n        return True\n\n    def get(self, key: str) -\u003e Optional[str]:\n        \"\"\" \"\"\"\n        data = self.dict()\n\n        if key in data:\n            return data[key]\n\n        if self.verbose:\n            logger.warning(\"Key %s not found in %s.\", key, self.dotenv_path)\n\n        return None\n\n\ndef get_key(\n    dotenv_path: StrPath,\n    key_to_get: str,\n    encoding: Optional[str] = \"utf-8\",\n) -\u003e Optional[str]:\n    \"\"\"\n    Get the value of a given key from the given .env.\n\n    Returns `None` if the key isn't found or doesn't have a value.\n    \"\"\"\n    return DotEnv(dotenv_path, verbose=True, encoding=encoding).get(key_to_get)\n\n\n@contextmanager\ndef rewrite(\n    path: StrPath,\n    encoding: Optional[str],\n) -\u003e Iterator[Tuple[IO[str], IO[str]]]:\n    pathlib.Path(path).touch()\n\n    with tempfile.NamedTemporaryFile(mode=\"w\", encoding=encoding, delete=False) as dest:\n        error = None\n        try:\n            with open(path, encoding=encoding) as source:\n                yield (source, dest)\n        except BaseException as err:\n            error = err\n\n    if error is None:\n        shutil.move(dest.name, path)\n    else:\n        os.unlink(dest.name)\n        raise error from None\n\n\ndef set_key(\n    dotenv_path: StrPath,\n    key_to_set: str,\n    value_to_set: str,\n    quote_mode: str = \"always\",\n    export: bool = False,\n    encoding: Optional[str] = \"utf-8\",\n) -\u003e Tuple[Optional[bool], str, str]:\n    \"\"\"\n    Adds or Updates a key/value to the given .env\n\n    If the .env path given doesn't exist, fails instead of risking creating\n    an orphan .env somewhere in the filesystem\n    \"\"\"\n    if quote_mode not in (\"always\", \"auto\", \"never\"):\n        raise ValueError(f\"Unknown quote_mode: {quote_mode}\")\n\n    quote = quote_mode == \"always\" or (\n        quote_mode == \"auto\" and not value_to_set.isalnum()\n    )\n\n    if quote:\n        value_out = \"'{}'\".format(value_to_set.replace(\"'\", \"\\\\'\"))\n    else:\n        value_out = value_to_set\n    if export:\n        line_out = f\"export {key_to_set} ld work without __file__, e.g. in REPL or IPython notebook.\n        path = os.getcwd()\n    else:\n        # will work for .py files\n        frame = sys._getframe()\n        current_file = __file__\n\n        while frame.f_code.co_filename == current_file or not os.path.exists(\n            frame.f_code.co_filename\n        ):\n            assert frame.f_back is not None\n            frame = frame.f_back\n        frame_filename = frame.f_code.co_filename\n        path = os.path.dirname(os.path.abspath(frame_filename))\n\n    for dirname in _walk_to_root(path):\n        check_path = os.path.join(dirname, filename)\n        if os.path.isfile(check_path):\n            return check_path\n\n    if raise_error_if_not_found:\n        raise IOError(\"File not found\")\n\n    return \"\"\n\n\ndef load_dotenv(\n    dotenv_path: Optional[StrPath] = None,\n    stream: Optional[IO[str]] = None,\n    verbose: bool = False,\n    override: bool = False,\n    interpolate: bool = True,\n    encoding: Optional[str] = \"utf-8\",\n) -\u003e bool:\n    \"\"\"Parse a .env file and then load all the variables found as environment variables.\n\n    Parameters:\n        dotenv_path: Absolute or relative path to .env file.\n        stream: Text stream (such as `io.StringIO`) with .env content, used if\n            `dotenv_path` is `None`.\n        verbose: Whether to output a warning the .env file is missing.\n        override: Whether to override the system environment variables with the variables\n            from the `.env` file.\n        encoding: Encoding to be used to read the file.\n    Returns:\n        Bool: True if at least one environment variable is set else False\n\n    If both `dotenv_path` and `stream` are `None`, `find_dotenv()` is used to find the\n    .env file with it's default parameters. If you need to change the default parameters\n    of `find_dotenv()`, you can explicitly call `find_dotenv()` and pass the result\n    to this function as `dotenv_path`.\n    \"\"\"\n
