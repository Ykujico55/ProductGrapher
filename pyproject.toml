[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "how2trust"
version = "0.3.0"
description = "Deterministic, evidence-linked architecture diagrams for Python repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
how2trust = "how2trust.__main__:main"

[tool.setuptools]
packages = ["how2trust"]

[tool.setuptools.package-data]
how2trust = ["assets/*.html", "assets/*.css", "assets/*.js"]
